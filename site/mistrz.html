<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<title>Lekcje Mistrza · Akademia Alterbake</title>
<style>
:root{
  --tlo:#0d0b09;--tlo2:#15110e;--karta:#1d1814;--karta2:#28211b;--papier:#eadcc5;
  --tekst:#f4eee5;--cichy:#b8aa9d;--linia:#493b30;--akcent:#c67937;--akcent2:#edb06f;
  --miedz:#8f4c26;--turkus:#4d7b78;--ok:#78bd8d;--uwaga:#dfaa55;--blad:#db776a;
  --r:18px;--cien:0 22px 55px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{background:var(--tlo);scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;margin:0;padding-bottom:calc(82px + env(safe-area-inset-bottom));color:var(--tekst);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;background:
  radial-gradient(circle at 15% -10%,rgba(198,121,55,.18),transparent 34rem),
  radial-gradient(circle at 90% 28%,rgba(77,123,120,.08),transparent 28rem),
  repeating-linear-gradient(94deg,rgba(255,255,255,.012) 0 1px,transparent 1px 7px),var(--tlo)}
button,a,textarea{font:inherit}
button,a{touch-action:manipulation}
button{color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--akcent2);outline-offset:3px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(13,11,9,.92);border-bottom:1px solid rgba(237,176,111,.18);backdrop-filter:blur(15px)}
header a{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--linia);border-radius:50%;color:var(--papier);text-decoration:none;background:linear-gradient(145deg,#241d18,#15110e);box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
header div{min-width:0;flex:1}
header h1{margin:0;overflow:hidden;font:700 18px/1.15 ui-serif,Georgia,serif;letter-spacing:.01em;text-overflow:ellipsis;white-space:nowrap}
header p,.nadtytul,.etykieta{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
header p{margin:3px 0 0;color:var(--cichy);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
main{max-width:820px;margin:0 auto;padding:16px}
.karta{position:relative;overflow:hidden;margin-bottom:14px;padding:19px;background:linear-gradient(155deg,rgba(37,30,24,.98),rgba(25,21,17,.98));border:1px solid var(--linia);border-radius:var(--r);box-shadow:var(--cien)}
.karta:before{position:absolute;inset:0;pointer-events:none;content:"";background:linear-gradient(115deg,rgba(255,255,255,.025),transparent 28%)}
.hero{padding:24px 20px;background:linear-gradient(145deg,rgba(143,76,38,.32),rgba(29,24,20,.97) 58%)}
.hero-start{min-height:360px;display:flex;flex-direction:column;justify-content:flex-end;background-position:center;background-size:cover}
.hero-start:after{position:absolute;inset:0;content:"";background:linear-gradient(180deg,rgba(10,8,7,.14) 0,rgba(10,8,7,.62) 48%,rgba(10,8,7,.96) 100%)}
.hero-start>*{position:relative;z-index:1}
.nadtytul{margin-bottom:9px;color:var(--akcent2);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h2{margin:0 0 13px;font:750 clamp(29px,8vw,47px)/1.02 ui-serif,Georgia,serif;letter-spacing:-.035em;text-wrap:balance}
h3{margin:0 0 8px;font:700 20px/1.25 ui-serif,Georgia,serif}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}
.cichy{color:var(--cichy);font-size:14px}
.mini{font-size:12px}
.ostra{max-width:680px;margin:16px 0;padding-left:14px;border-left:3px solid var(--akcent);color:var(--papier);font:600 19px/1.48 ui-serif,Georgia,serif}
.plakietka{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid rgba(237,176,111,.14);border-radius:999px;background:rgba(198,121,55,.13);color:var(--akcent2);font:700 10px/1.2 ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.04em;text-transform:uppercase}
.plakietka.ok{background:rgba(120,189,141,.13);color:var(--ok)}
.plakietka.uwaga{background:rgba(223,170,85,.13);color:var(--uwaga)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.przycisk{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:11px;padding:12px 15px;border:1px solid var(--akcent);border-radius:13px;background:linear-gradient(135deg,var(--akcent2),var(--akcent));color:#1a1009;text-decoration:none;font-weight:850;cursor:pointer;box-shadow:0 9px 24px rgba(143,76,38,.23)}
.przycisk:hover{filter:brightness(1.08)}
.przycisk.drugi{border-color:var(--linia);background:transparent;color:var(--tekst);box-shadow:none}
.przycisk.maly{width:auto;min-height:42px;margin:0;padding:9px 13px;font-size:13px}
.przycisk.niebezpieczny{border-color:rgba(219,119,106,.38);background:transparent;color:#e8a39a;box-shadow:none}
.siatka{display:grid;gap:11px}
.lekcja,.prog{position:relative;width:100%;overflow:hidden;text-align:left;background:linear-gradient(150deg,var(--karta),#16120f);color:var(--tekst);border:1px solid var(--linia);border-radius:15px;cursor:pointer;transition:transform .18s ease,border-color .18s ease}
.lekcja{padding:16px}
.prog{min-height:205px;display:flex;align-items:flex-end;padding:0;background-position:center;background-size:cover}
.prog:before{position:absolute;inset:0;content:"";background:linear-gradient(180deg,rgba(9,8,7,.12),rgba(9,8,7,.92))}
.prog-tresc{position:relative;z-index:1;width:100%;padding:16px}
.lekcja:hover,.prog:hover{transform:translateY(-2px);border-color:var(--akcent)}
.lekcja .glowa,.prog .glowa{display:flex;gap:10px;align-items:flex-start}
.numer{flex:none;display:grid;place-items:center;min-width:31px;height:31px;border:1px solid rgba(237,176,111,.34);border-radius:50%;color:var(--akcent2);font:800 11px/1 ui-monospace,monospace}
.lekcja b,.prog b{display:block;font:700 17px/1.3 ui-serif,Georgia,serif}
.lekcja p,.prog p{margin:7px 0 0;color:var(--cichy);font-size:13px;line-height:1.48}
.prog p{color:#d7cbc0}
.powod{margin-top:11px;padding-top:11px;border-top:1px solid var(--linia);color:var(--akcent2);font-size:12px}
.sekcja{position:relative;padding-top:20px}
.sekcja .etykieta{margin-bottom:7px;color:var(--akcent2);font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.sekcja+.sekcja{margin-top:19px;border-top:1px solid var(--linia)}
.sekcja p{font-size:16px;line-height:1.68}
.ruch{background:linear-gradient(145deg,rgba(125,65,31,.42),rgba(34,27,21,.98));border-color:rgba(237,176,111,.48)}
.ruch .duzy{color:var(--papier);font:700 22px/1.42 ui-serif,Georgia,serif}
.progi{display:grid;grid-template-columns:1fr;gap:11px}
.tryb{display:flex;align-items:flex-start;gap:11px;margin-top:14px;padding-top:14px;border-top:1px solid var(--linia)}
.tryb .znak{color:var(--akcent2);font-size:24px;line-height:1}
.obraz-lekcji{margin:0 0 14px;overflow:hidden;background:#100d0b;border:1px solid var(--linia);border-radius:var(--r);box-shadow:var(--cien)}
.obraz-lekcji img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.obraz-lekcji figcaption{padding:13px 15px;color:var(--papier);font:600 15px/1.5 ui-serif,Georgia,serif;background:linear-gradient(135deg,rgba(77,123,120,.13),rgba(198,121,55,.1))}
.obraz-lekcji figcaption:before{content:"KOTWICA  ";color:var(--akcent2);font:800 9px/1 ui-monospace,monospace;letter-spacing:.15em}
.pamiec{border-color:rgba(77,123,120,.55);background:linear-gradient(145deg,rgba(44,70,67,.24),rgba(27,23,19,.98))}
.pamiec .odpowiedz{margin-top:14px;padding:14px;border-left:3px solid var(--turkus);background:rgba(77,123,120,.1);color:var(--papier)}
.blad{min-height:20px;margin-top:8px;color:#ef9e94;font-size:13px}
.formularz label{display:block;margin-bottom:7px;color:var(--cichy);font-size:12px}
textarea{width:100%;min-height:104px;resize:vertical;padding:13px;background:var(--karta2);color:var(--tekst);border:1px solid var(--linia);border-radius:12px;font-size:15px;line-height:1.5}
.proba{border-left:4px solid var(--linia)}
.proba.plan{border-left-color:var(--uwaga)}
.proba.dziala,.proba.czesc{border-left-color:var(--ok)}
.akcje{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.akcje button{flex:1 1 128px;min-height:44px;padding:9px;border:1px solid var(--linia);border-radius:10px;background:var(--karta2);color:var(--tekst);cursor:pointer}
.akcje button:hover{border-color:var(--akcent)}
.pusty{text-align:center;padding:34px 19px;color:var(--cichy)}
nav{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;background:rgba(20,16,13,.96);border-top:1px solid rgba(237,176,111,.18);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(14px)}
nav button{flex:1;min-height:68px;border:0;background:none;color:var(--cichy);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.04em;cursor:pointer}
nav button span{display:block;margin-bottom:5px;color:inherit;font:600 19px/1 ui-serif,serif}
nav button.aktywny{color:var(--akcent2)}
.ukryty{display:none!important}
@media(min-width:650px){main{padding:24px}.progi{grid-template-columns:1fr 1fr}.siatka.rekomendacje{grid-template-columns:repeat(3,1fr)}.lekcja{height:100%}.hero-start{min-height:470px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media(prefers-contrast:more){:root{--cichy:#d0c6bd;--linia:#796555}.karta,.lekcja,.prog{border-width:2px}}
</style>
</head>

<script>(function (root, factory) {
  var dane = factory();
  if (typeof module === 'object' && module.exports) module.exports = dane;
  root.AlterbakeMistrzDane = dane;

  'use strict';

  var PROGI = [
    { id: 'mgla', nr: 'I', nazwa: 'Widzenie mgły', opis: 'Oddziel fakt od opowieści, zanim zaczniesz naprawiać nie ten problem.', grafika: 'prog-mgla.jpg', alt: 'Ostrze rozcina ciemną mgłę i odsłania pojedynczy mosiężny znacznik na stole.', symbol: '◐' },
    { id: 'ostrze', nr: 'II', nazwa: 'Własne ostrze', opis: 'Używaj przewagi świadomie i pilnuj cienia, który idzie za nią.', grafika: 'prog-ostrze.jpg', alt: 'Wykute ostrze leży na stole, a jego długi cień pada na jasne płótno.', symbol: '◇' },
    { id: 'cena', nr: 'III', nazwa: 'Cena', opis: 'Każde „tak” zjada czas, uwagę albo zaufanie. Licz koszt przed ruchem.', grafika: 'prog-cena.jpg', alt: 'Waga pokazuje koszt wyboru: ciężarek przeważa chleb, klepsydrę i narzędzie.', symbol: '⚖' },
    { id: 'cialo', nr: 'IV', nazwa: 'Ciało', opis: 'Rozpoznaj próg przeciążenia, zanim ciało podejmie decyzję za Ciebie.', grafika: 'prog-cialo.jpg', alt: 'Dłoń odsuwa rozgrzewający się metal tuż przed wejściem w czerwoną strefę.', symbol: '◒' },
    { id: 'relacje', nr: 'V', nazwa: 'Relacje', opis: 'Mów jasno, sprawdzaj zrozumienie i stawiaj granice bez przedstawienia teatralnego.', grafika: 'prog-relacje.jpg', alt: 'Dwie osoby przekazują sobie świetlistą nić i potwierdzają odbiór komunikatu.', symbol: '↔' },
    { id: 'praca', nr: 'VI', nazwa: 'Praca i dzieło', opis: 'Domykaj wynik, przekazanie i odpowiedzialność — nie tylko własny ruch.', grafika: 'prog-praca.jpg', alt: 'Dwie pary dłoni wspólnie trzymają przekazywany, zapieczętowany bochenek.', symbol: '✓' },
    { id: 'natchnienie', nr: 'VII', nazwa: 'Natchnienie', opis: 'Zamieniaj pomysł w mały dowód. Entuzjazm jest zapłonem, nie kierownicą.', grafika: 'prog-natchnienie.jpg', alt: 'Pojedyncza iskra zostaje bezpiecznie schwytana pod szklanym kloszem obok prototypu.', symbol: '✦' }
  ];

  var LEKCJE = [
    {
      id: 'fakt-przed-opowiescia', prog: 'mgla', tytul: 'Fakt przed opowieścią', czas: 4,
      ostrze: 'Nie rozwiązuj opowieści. Najpierw znajdź fakt.',
      pole: 'Na zmianie pada zdanie: „nikt nigdy nie przekazuje informacji”. Brzmi jak diagnoza, ale jest tylko dymem. Faktem może być jedno nieprzekazane zadanie, brak potwierdzenia albo ustalenie, którego nikt nie zapisał. Każde wymaga innego ruchu.',
      wrog: 'Pewność zbudowana z tonu głosu. Człowiek mówi głośno, mózg dopisuje dowody. Stary numer; ludzkość ćwiczy go od ogniska i nadal nie zaliczyła egzaminu.',
      cena: 'Naprawiasz charakter człowieka, choć zepsuło się przekazanie. Rośnie napięcie, a problem wraca w nowym ubraniu.',
      ruch: 'Przed reakcją zapisz trzy linie: CO WIEM — CO DOPOWIADAM — CO SPRAWDZĘ. Wykonaj tylko trzecią linię.',
      integracja: 'Przy najbliższym mocnym osądzie zatrzymaj się na 60 sekund. Nazwij jeden obserwowalny fakt i jedno pytanie, które rozstrzyga sytuację.',
      reszta: 'Intencje, „zawsze”, „nigdy” i sąd nad całym człowiekiem po jednym zdarzeniu.',
      przyklad: '„Nie dostałem potwierdzenia przekazania o 9:10. Czy zadanie zostało przyjęte, czy utknęło między nami?”',
      kotwica: 'Ostrze rozcina mgłę. Po jasnej stronie zostaje tylko to, co da się zobaczyć albo sprawdzić.',
      sprawdz: { pytanie: 'Jakie trzy linie zapisujesz przed reakcją?', odpowiedz: 'CO WIEM — CO DOPOWIADAM — CO SPRAWDZĘ.' },
      rozwoj: { trenuje: ['problemSolving', 'communication', 'integrity'], wzmacnia: ['problemSolving'], rownowazy: ['influence', 'empathy', 'purpose'] }
    },
    {
      id: 'zdarzenie-to-nie-wzorzec', prog: 'mgla', tytul: 'Zdarzenie to nie wzorzec', czas: 3,
      ostrze: 'Jedna wpadka wymaga korekty. Wzorzec wymaga zmiany systemu. Nie myl tych rachunków.',
      pole: 'Błąd pojawia się pierwszy raz, ale jest kosztowny. Pokusa każe od razu tworzyć procedurę, szkolenie i zakaz. Druga pokusa każe machnąć ręką, bo „każdemu się zdarza”. Obie są leniwe — jedna produkuje papier, druga powtórki.',
      wrog: 'Pamięć, która liczy emocje zamiast przypadków. Trzy ciche sukcesy przegrywają z jednym głośnym błędem.',
      cena: 'Albo obciążasz wszystkich kontrolą po jednym incydencie, albo ignorujesz sygnał, który właśnie zaczął się powtarzać.',
      ruch: 'Oznacz zdarzenie jako PIERWSZE / POWTÓRKA / WZORZEC. Przy pierwszym — korekta i zapis. Przy powtórce — szukanie wspólnej przyczyny. Przy wzorcu — właściciel zmiany i termin sprawdzenia.',
      integracja: 'Przez tydzień zbierz trzy przykłady, zanim nazwiesz coś „zawsze”. Jeśli trzeciego nie ma, język też ma nie udawać, że jest.',
      reszta: 'Diagnozy typu „taki już jest” i procesy pisane w odwecie.',
      przyklad: '„To drugi podobny przypadek w pięć dni. Sprawdźmy wspólny moment, nie polujmy na winnego.”',
      kotwica: 'Jeden ślad to zdarzenie. Trzy podobne ślady zaczynają rysować wzorzec.',
      sprawdz: { pytanie: 'Co robisz przy pierwszym zdarzeniu, a co przy wzorcu?', odpowiedz: 'Pierwsze: korekta i zapis. Wzorzec: właściciel zmiany i termin sprawdzenia.' },
      rozwoj: { trenuje: ['problemSolving', 'reliability'], wzmacnia: ['integrity', 'problemSolving'], rownowazy: ['precision', 'standards', 'optymizm'] }
    },
    {
      id: 'przewaga-ma-cien', prog: 'ostrze', tytul: 'Przewaga ma cień', czas: 4,
      ostrze: 'Talent użyty bez miary staje się wadą z dobrym PR-em.',
      pole: 'Dokładność może chronić jakość albo zatrzymać tempo. Empatia może budować zaufanie albo odkładać trudną rozmowę. Inicjatywa może ulepszać pracę albo urządzać innym życie bez zaproszenia. To samo ostrze; różni się chwyt.',
      wrog: 'Wiara, że skoro coś jest mocną stroną, to większa dawka zawsze pomoże. Nawet sól zna lepsze proporcje.',
      cena: 'Bronisz zachowania nazwą talentu i przestajesz zauważać jego koszt dla wyniku albo ludzi.',
      ruch: 'Dokończ zdanie: „Moja przewaga pomaga, gdy…; zaczyna szkodzić, gdy…; sygnałem granicy jest…”. Wybierz jeden sygnał widoczny dla innych.',
      integracja: 'Poproś jedną osobę o konkretny przykład, kiedy Twoja mocna strona pomogła i kiedy przesadziła. Bez obrony. Obrona jest bezpłatna, dlatego ludzie nadużywają jej jak folii spożywczej.',
      reszta: 'Etykieta „taki mam charakter” używana jak przepustka służbowa.',
      przyklad: '„Moja dokładność pomaga przy kontroli. Szkodzi, gdy poprawiam detal po czasie decyzji.”',
      kotwica: 'To samo ostrze ma błysk i cień. Dawkę poznajesz po skutku, nie po nazwie talentu.',
      sprawdz: { pytanie: 'Jak brzmi zdanie do kalibracji mocnej strony?', odpowiedz: 'Pomaga, gdy…; szkodzi, gdy…; sygnałem granicy jest…' },
      rozwoj: { trenuje: ['learning', 'collaboration'], wzmacnia: ['learning'], rownowazy: ['precision', 'standards', 'empathy', 'initiative', 'communication', 'regulation'] }
    },
    {
      id: 'pomoc-przed-sciana', prog: 'ostrze', tytul: 'Pomoc przed ścianą', czas: 3,
      ostrze: 'Samodzielność kończy się tam, gdzie milczenie zaczyna kosztować zespół.',
      pole: 'Ktoś próbuje dowieźć zadanie sam, bo zwykle potrafi. Sygnały ostrzegawcze pojawiają się wcześniej, lecz prośba o pomoc przychodzi dopiero wtedy, gdy zostały dwie złe opcje. To nie autonomia. To samotna produkcja niespodzianki.',
      wrog: 'Wstyd przed pytaniem i nadzieja, że jeszcze jeden wysiłek naprawi brak czasu, danych albo decyzji.',
      cena: 'Zespół traci możliwość pomocy wtedy, gdy pomoc była tania. Dostaje problem dopiero w wersji premium.',

      reszta: 'Heroizm, który istnieje głównie dlatego, że informacja przyszła za późno.',
      przyklad: '„Jestem w połowie. Brakuje decyzji X; bez niej termin jest zagrożony. Potrzebuję odpowiedzi do 12:00.”',
      kotwica: 'Alarm uruchamia się przed ścianą, nie po zderzeniu.',
      sprawdz: { pytanie: 'Jakie są trzy elementy zgłoszenia pomocy?', odpowiedz: 'Stan — ryzyko — konkretna potrzeba.' },

      pole: 'Pojawia się dobry pomysł, pilna prośba albo drobna poprawka. Każda osobno wygląda niewinnie. Razem zjadają margines, a potem wszyscy są zaskoczeni, że doba nie została powiadomiona o zmianie planu.',

          : ['Punkt startu bez testu: oddzielanie faktu od opowieści.', 'Punkt startu bez testu: przewaga i jej koszt.', 'Punkt startu bez testu: działanie w małej, odwracalnej skali.'];
        dodaj(poId.get(id), i === 0 ? 'punkt startu' : i === 1 ? 'równowaga' : 'próba', powody[i]);
      });
      return { spersonalizowane: false, tryb: trybUczenia(profil), pozycje: wynik };
    }

    var obszary = pozycjeNumeryczne(profil.wyniki).sort(function (a, b) { return b.wynik - a.wynik || a.id.localeCompare(b.id); });
    var talenty = pozycjeNumeryczne(profil.talenty).sort(function (a, b) { return b.wynik - a.wynik || a.id.localeCompare(b.id); });
    var mocny = obszary[0];
    var tarcie = obszary[obszary.length - 1];
    var talent = talenty[0];

    if (mocny) dodaj(
      pierwszaPasujaca(lekcje, 'wzmacnia', mocny.id, uzyte),
      'oprzyj na sile',
      'Wynik wskazuje zasób „' + (OBSZARY[mocny.id] || mocny.id) + '”. Lekcja ma zamienić go w powtarzalne zachowanie.'
    );
    if (talent) dodaj(
      pierwszaPasujaca(lekcje, 'rownowazy', talent.id, uzyte),
      'pilnuj cienia',
      'Mocny talent „' + (TALENTY[talent.id] || talent.id) + '” ma koszt przy nadmiarze. To przeciwwaga, nie naprawa wady.'
    );
    if (tarcie) dodaj(
      pierwszaPasujaca(lekcje, 'trenuje', tarcie.id, uzyte),
      'sprawdź tarcie',
      'Obszar „' + (OBSZARY[tarcie.id] || tarcie.id) + '” warto sprawdzić zachowaniem. Niski wynik nie jest diagnozą.'
    );

    domyslne.forEach(function (id) {
      if (wynik.length < 3) dodaj(poId.get(id), 'uzupełnienie', 'Lekcja uzupełnia ścieżkę o obserwację albo mały test.');
    });
    return { spersonalizowane: true, tryb: trybUczenia(profil), pozycje: wynik.slice(0, 3) };

  function pustyStan() { return { wersja: 1, proby: [] }; }

  function stanZ(surowe) {
    var s = odczytajJSON(surowe);
    if (!obiekt(s) || !Array.isArray(s.proby)) return pustyStan();
    return { wersja: 1, proby: s.proby.filter(obiekt).slice(-100) };
  }

  function dopiszProbe(stan, proba) {
    var s = stanZ(stan);
    if (s.proby.some(function (x) { return x.status === 'plan'; })) return s;
    var p = {
      id: String((proba && proba.id) || ('proba-' + Date.now())),
      lekcjaId: String((proba && proba.lekcjaId) || ''),
      utworzono: String((proba && proba.utworzono) || new Date().toISOString()),
      kontekst: String((proba && proba.kontekst) || '').trim().slice(0, 500),
      status: ['plan', 'dziala', 'czesciowo', 'nie'].indexOf(proba && proba.status) >= 0 ? proba.status : 'plan',
      dowod: String((proba && proba.dowod) || '').trim().slice(0, 500)
    };
    if (!p.lekcjaId) return s;
    s.proby.push(p);
    s.proby = s.proby.slice(-100);
    return s;
  }

  function aktualizujProbe(stan, id, zmiany) {
    var s = stanZ(stan);
    s.proby = s.proby.map(function (p) {
      if (p.id !== id) return p;
      var kopia = Object.assign({}, p);
      var dowod = zmiany && Object.prototype.hasOwnProperty.call(zmiany, 'dowod')
        ? String(zmiany.dowod || '').trim().slice(0, 500)
        : String(kopia.dowod || '').trim().slice(0, 500);
      kopia.dowod = dowod;
      if (zmiany && ['plan', 'dziala', 'czesciowo', 'nie'].indexOf(zmiany.status) >= 0) {
        kopia.status = zmiany.status === 'plan' || dowod.length >= MIN_DOWOD ? zmiany.status : 'plan';
      }
      return kopia;
    });
    return s;
  }

  function aktywnaProba(stan) {
    return stanZ(stan).proby.slice().reverse().find(function (p) { return p.status === 'plan'; }) || null;
  }

  function usunProbe(stan, id) {
    var s = stanZ(stan);
    s.proby = s.proby.filter(function (p) { return p.id !== id; });
    return s;
  }

  function postepLekcji(stan, lekcjaId) {
    var proby = stanZ(stan).proby.filter(function (p) { return p.lekcjaId === lekcjaId; });
    var zakonczone = proby.filter(function (p) { return p.status !== 'plan' && String(p.dowod || '').trim().length >= MIN_DOWOD; });
    var udane = zakonczone.filter(function (p) { return p.status === 'dziala' || p.status === 'czesciowo'; });
    return {
      proby: proby.length,
      zakonczone: zakonczone.length,
      udane: udane.length,
      stan: zakonczone.length >= 3 && udane.length >= 2 ? 'przetestowane' : proby.some(function (p) { return p.status === 'plan'; }) ? 'w-toku' : 'nowe'
    };
  }

  return {
    OBSZARY: OBSZARY, TALENTY: TALENTY,
    ostatniProfil: ostatniProfil,
    wiarygodnoscPozwala: wiarygodnoscPozwala,
    trybUczenia: trybUczenia,
    rekomenduj: rekomenduj,
    MIN_DOWOD: MIN_DOWOD,
    stanZ: stanZ,
    dopiszProbe: dopiszProbe,
    aktualizujProbe: aktualizujProbe,
    aktywnaProba: aktywnaProba,
    usunProbe: usunProbe,
    postepLekcji: postepLekcji
  };
});</script>
