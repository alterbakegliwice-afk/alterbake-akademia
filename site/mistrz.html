<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDE7DA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🥖</text></svg>">
<title>Rzemiosło człowieka · Akademia Alterbake</title>
<style>
:root{
  --ab-ink:#30252B;
  --ab-paper:#F4F1E9;
  --ab-surface:#FCFBF7;
  --ab-context:#C6D0C5;
  --ab-rule:#CEC8BF;
  --ab-muted:#72666B;
  --ab-czern:#30252B;
  --ab-papier:#F4F1E9;
  --ab-dab:#CEC8BF;
  --ab-taupe:#72666B;
  --ab-terakota:#30252B;
  --ab-oliwka:#3F6B4A;
  --ab-sukces:#3F6B4A;
  --ab-uwaga:#8A5A12;
  --ab-blad:#9B3B33;
  --ab-font-display:"Newsreader", Georgia, "Times New Roman", serif;
  --ab-font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ab-font-mono:"IBM Plex Sans", system-ui, sans-serif;
  --ab-r:4px; --ab-r-sm:4px;
  --tlo:var(--ab-papier);--tlo2:#F5EFE3;--karta:#FBF8F1;--karta2:#F3EBDD;--papier:#FFFDF8;
  /* --cichy: taupe z kanonu ściemniony do progu WCAG AA. Sam #6E6A5F na
     papierze daje 4,38:1 przy 15 px, czyli PONIŻEJ 4,5:1 — a to jest kolor
     całego tekstu drugiego planu (wyjaśnienia pętli, granice narzędzia).
     Mieszamy z czernią marki zamiast wpisywać nowy HEX: token zostaje
     źródłem, zmienia się tylko domieszka. Domieszkę wstawia `@supports` niżej,
     a nie druga deklaracja obok: własność niestandardowa przyjmuje przy
     parsowaniu DOWOLNY ciąg tokenów, więc podwójna deklaracja nie jest tu
     żadnym zabezpieczeniem — wygrywa późniejsza, a awaria przychodzi dopiero
     przy podstawieniu `var()` i wtedy kolor się DZIEDZICZY. */
  --tekst:var(--ab-czern);--cichy:var(--ab-taupe);
  --linia:#DED3C2;--akcent:var(--ab-terakota);--akcent2:#8E3E22;
  --miedz:var(--ab-terakota);--turkus:#426D69;--ok:var(--ab-sukces);--uwaga:var(--ab-uwaga);--blad:var(--ab-blad);
  /* --alarm: kolor KOMUNIKATU o błędzie (nie ramki). Do 02.09.2026 stał tu
     jasny łosoś #ef9e94 — resztka po ciemnym czytniku. Na papierze dawał
     1,98:1, więc jedyne zdanie pilnujące progu dowodu wyglądało jak tekst
     wyszarzony. Ciemny wariant dostaje własną wartość niżej. */
  --alarm:var(--ab-blad);
  /* Kafle progów LEŻĄ NA CIEMNYM PRZYCIEMNIENIU zdjęcia, więc mają własną,
     stałą paletę — niezależną od motywu strony. */
  --na-zdjeciu:#F7F1E8;--na-zdjeciu-cichy:#D7CBC0;--na-zdjeciu-numer:#EDB07A;
  --r:var(--ab-r);--cien:0 1px 2px rgba(20,20,19,.05),0 8px 24px rgba(20,20,19,.07);
  --serif:var(--ab-font-display);--sans:var(--ab-font-body);--mono:var(--ab-font-mono)
}
@supports (color:color-mix(in srgb,red 50%,blue)){:root{--cichy:color-mix(in srgb,var(--ab-taupe) 86%,var(--ab-czern))}}
*{box-sizing:border-box}
html{background:var(--tlo);scroll-behavior:smooth}
body{min-height:100vh;min-height:100dvh;margin:0;padding-bottom:calc(82px + env(safe-area-inset-bottom));color:var(--tekst);font:17px/1.62 var(--sans);-webkit-text-size-adjust:100%;background:radial-gradient(900px 420px at 100% -10%,rgba(194,160,107,.18),transparent 65%),var(--tlo)}
button,a,textarea{font:inherit}
button,a{touch-action:manipulation}
button{color:inherit}
/* Kolejność: najpierw zdejmij domyślny pierścień z tytułu (fokus dostaje
   programowo przy zmianie ekranu), dopiero potem oddaj go klawiaturze.
   Odwrotna kolejność — a taka tu stała — kasowała pierścień ZAWSZE. */
#naglowek:focus{outline:none}
button:focus-visible,a:focus-visible,textarea:focus-visible,#naglowek:focus-visible{outline:3px solid var(--akcent2);outline-offset:3px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--karta);background:color-mix(in srgb,var(--karta) 92%,transparent);border-bottom:1px solid var(--linia);backdrop-filter:blur(12px);box-shadow:0 1px 2px rgba(20,20,19,.05)}
header a{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--linia);border-radius:12px;color:var(--tekst);text-decoration:none;background:linear-gradient(145deg,#F1E4CB,#F4E2D6)}
header div{min-width:0;flex:1}
header h1{margin:0;overflow:hidden;font:700 18px/1.15 var(--serif);letter-spacing:.01em;text-overflow:ellipsis;white-space:nowrap}
header p,.nadtytul,.etykieta{font-family:var(--mono)}
header p{margin:3px 0 0;color:var(--cichy);font-size:10px;letter-spacing:.13em;text-transform:uppercase}
main{max-width:860px;margin:0 auto;padding:16px}
.karta{position:relative;overflow:hidden;margin-bottom:14px;padding:20px;background:var(--karta);border:1px solid var(--linia);border-radius:var(--r);box-shadow:var(--cien)}
.hero{padding:25px 21px;background:linear-gradient(145deg,#F6EBDD,var(--karta) 64%);border-left:5px solid var(--ab-dab)}
/* Do 02.09.2026 stało tu `background:none!important` — tarcza przed inline'owym
   `style.backgroundImage`, który zszedł z `ekranSciezka` w tej samej zmianie.
   Została sama tarcza i robiła pierwszą kartę modułu przezroczystą. */
.hero-start{min-height:auto;display:block}
.nadtytul{margin-bottom:9px;color:var(--akcent2);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h2{margin:0 0 13px;font:750 clamp(28px,8vw,46px)/1.08 var(--serif);letter-spacing:-.025em;text-wrap:balance}
h3{margin:0 0 8px;font:700 21px/1.25 var(--serif)}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}
.cichy{color:var(--cichy);font-size:14px}
.mini{font-size:12px}
.ostra{max-width:680px;margin:16px 0;padding-left:14px;border-left:3px solid var(--akcent);color:var(--tekst);font:600 19px/1.48 var(--serif)}
.plakietka{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--linia);border-radius:999px;background:#F4E2D6;color:var(--akcent2);font:700 10px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.plakietka.ok{background:rgba(120,189,141,.13);color:var(--ok)}
.plakietka.uwaga{background:rgba(223,170,85,.13);color:var(--uwaga);color:color-mix(in srgb,var(--uwaga) 72%,var(--ab-czern))}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0}
.przycisk{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:11px;padding:12px 15px;border:1px solid var(--akcent);border-radius:13px;background:var(--akcent);color:#fff;text-decoration:none;font-weight:850;cursor:pointer;box-shadow:0 6px 18px rgba(181,83,46,.18)}
.przycisk:hover{filter:brightness(1.08)}
.przycisk.drugi{border-color:var(--linia);background:transparent;color:var(--tekst);box-shadow:none}
.przycisk.maly{width:auto;min-height:42px;margin:0;padding:9px 13px;font-size:13px}
.przycisk.niebezpieczny{border-color:var(--alarm);border-color:color-mix(in srgb,var(--alarm) 45%,transparent);background:transparent;color:var(--alarm);box-shadow:none}
/* Etykieta „Wgraj profil z pliku" jest przyciskiem nad wizualnie ukrytym
   `input[type=file]` — domyślny pierścień fokusu (linia 47) trafiał więc na
   niewidoczny element, nie na to, co widać (redteam 05.09.2026, F5). Klasa
   dokładana/zdejmowana z inputa przy focus/blur. */
.przycisk.fokus{outline:3px solid var(--akcent2);outline-offset:3px}
.siatka{display:grid;gap:11px}
.lekcja,.prog{position:relative;width:100%;overflow:hidden;text-align:left;background:var(--karta);color:var(--tekst);border:1px solid var(--linia);border-radius:15px;cursor:pointer;box-shadow:var(--cien);transition:transform .18s ease,border-color .18s ease}
.lekcja{padding:16px}
.prog{min-height:205px;display:flex;align-items:flex-end;padding:0;background-color:#2A231D;background-position:center;background-size:cover}
.prog:before{position:absolute;inset:0;content:"";background:linear-gradient(180deg,rgba(9,8,7,.05),rgba(9,8,7,.86))}
/* Nazwa progu MUSI mieć własny, jasny kolor. Dziedziczyła `--tekst`, czyli
   w jasnym motywie czerń marki — a leży na przyciemnionym zdjęciu. Efekt:
   po wczytaniu grafik siedem głównych kafli pierwszego ekranu traciło tytuły
   (02.09.2026, QA na 390 px). Widać było numer i opis, nie było nazwy. */
.prog-tresc{position:relative;z-index:1;width:100%;padding:16px;color:var(--na-zdjeciu)}
.prog-tresc .numer{color:var(--na-zdjeciu-numer);border-color:rgba(237,176,111,.5)}
.lekcja:hover,.prog:hover{transform:translateY(-2px);border-color:var(--akcent)}
.lekcja .glowa,.prog .glowa{display:flex;gap:10px;align-items:flex-start}
.numer{flex:none;display:grid;place-items:center;min-width:31px;height:31px;border:1px solid rgba(237,176,111,.34);border-radius:50%;color:var(--akcent2);font:800 11px/1 ui-monospace,monospace}
.lekcja b,.prog b{display:block;font:700 17px/1.3 ui-serif,Georgia,serif}
.lekcja p,.prog p{margin:7px 0 0;color:var(--cichy);font-size:13px;line-height:1.48}
.prog p{color:var(--na-zdjeciu-cichy)}
.powod{margin-top:11px;padding-top:11px;border-top:1px solid var(--linia);color:var(--akcent2);font-size:12px}
.sekcja{position:relative;padding-top:20px}
.sekcja .etykieta{margin-bottom:7px;color:var(--akcent2);font-size:10px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.sekcja+.sekcja{margin-top:19px;border-top:1px solid var(--linia)}
.sekcja p{font-size:16px;line-height:1.68}
.ruch{background:linear-gradient(145deg,#F4E2D6,var(--karta));border-color:#D8B195}
.ruch .duzy{color:var(--tekst);font:700 22px/1.42 var(--serif)}
.progi{display:grid;grid-template-columns:1fr;gap:11px}
.tryb{display:flex;align-items:flex-start;gap:11px;margin-top:14px;padding-top:14px;border-top:1px solid var(--linia)}
.tryb .znak{color:var(--akcent2);font-size:24px;line-height:1}
.obraz-lekcji{margin:0 0 14px;overflow:hidden;background:var(--karta2);border:1px solid var(--linia);border-radius:var(--r);box-shadow:var(--cien)}
.obraz-lekcji img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.obraz-lekcji figcaption{padding:13px 15px;color:var(--tekst);font:600 15px/1.5 var(--serif);background:linear-gradient(135deg,#E5EEEA,#F4E2D6)}
.obraz-lekcji figcaption:before{content:"KOTWICA  ";color:var(--akcent2);font:800 9px/1 ui-monospace,monospace;letter-spacing:.15em}
/* Karta „odtwórz z pamięci" była CIEMNA także w jasnym motywie — resztka po
   czytniku sprzed 02.09.2026. Pytanie (czerń marki) i podpowiedź (taupe)
   lądowały na prawie czarnym tle: pytanie ledwo widoczne, podpowiedź znikała
   w połowie zdania. Karta jest odtąd papierowa jak reszta modułu, a turkus
   zostaje akcentem odsłoniętej odpowiedzi. */
.pamiec{border-color:rgba(66,109,105,.45);background:linear-gradient(145deg,#E7F0EC,var(--karta) 62%)}
.pamiec .odpowiedz{margin-top:14px;padding:14px;border-left:3px solid var(--turkus);background:rgba(66,109,105,.1);color:var(--tekst)}
.alterbake{border-color:rgba(181,83,46,.4);background:linear-gradient(145deg,#F4E9E1,var(--karta) 62%)}
.blad{min-height:20px;margin-top:8px;color:var(--alarm);font-size:13px;font-weight:600}
.formularz label{display:block;margin-bottom:7px;color:var(--cichy);font-size:12px}
textarea{width:100%;min-height:120px;resize:vertical;padding:14px;background:#FFFDF8;color:var(--tekst);border:1px solid var(--linia);border-radius:12px;font-size:17px;line-height:1.55}
.proba{border-left:4px solid var(--linia)}
.proba.plan{border-left-color:var(--uwaga)}
.proba.dziala,.proba.czesc{border-left-color:var(--ok)}
.akcje{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.akcje button{flex:1 1 128px;min-height:44px;padding:9px;border:1px solid var(--linia);border-radius:10px;background:var(--karta2);color:var(--tekst);cursor:pointer}
.akcje button:hover{border-color:var(--akcent)}
.pusty{text-align:center;padding:34px 19px;color:var(--cichy)}
nav{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;background:var(--karta);background:color-mix(in srgb,var(--karta) 96%,transparent);border-top:1px solid var(--linia);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(14px)}
nav button,nav a{flex:1;min-height:68px;border:0;background:none;color:var(--cichy);font:700 11px/1.2 var(--mono);letter-spacing:.02em;cursor:pointer;text-decoration:none;display:block;text-align:center}
nav button span,nav a span{display:block;margin-bottom:5px;color:inherit;font:600 19px/1 var(--serif)}
nav button.aktywny{color:var(--akcent2)}
.ukryty{display:none!important}
.petla{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:17px 0 4px}
.petla span{padding:9px 6px;border:1px solid var(--linia);border-radius:10px;background:var(--tlo2);font:700 11px/1.25 var(--mono);text-align:center}
.profil-mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.profil-mapa div{padding:12px;border:1px solid var(--linia);border-radius:12px;background:var(--tlo2)}
.profil-mapa small{display:block;margin-bottom:5px;color:var(--cichy);font:700 10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em}
.profil-mapa b{font:700 15px/1.35 var(--serif)}
details.rozwin{margin-top:14px;border-top:1px solid var(--linia);padding-top:12px}
details.rozwin summary{min-height:44px;display:flex;align-items:center;color:var(--akcent2);font-weight:750;cursor:pointer}
.krok-glowny{border-left:5px solid var(--akcent)}
@media(min-width:650px){main{padding:24px}.progi{grid-template-columns:1fr 1fr}.siatka.rekomendacje{grid-template-columns:repeat(3,1fr)}.lekcja{height:100%}}
@media(max-width:480px){main{padding:13px}.karta{padding:17px}.profil-mapa{grid-template-columns:1fr}.petla{grid-template-columns:1fr 1fr}.hero-start{min-height:auto}h2{font-size:30px}.cichy{font-size:15px}}
@media(prefers-color-scheme:dark){:root{--tlo:#171310;--tlo2:#2A231D;--karta:#211C17;--karta2:#2A231D;--papier:#F1E9DE;--tekst:#F1E9DE;--cichy:#A89A89;--linia:#45392E;/* Sygnały w ciemnym motywie mają WŁASNE wartości: zieleń i żółć kanonu są
   dobrane pod papier i na karcie #211C17 schodzą do 3,4:1 przy 10 px. */
--akcent:#D97A4D;--akcent2:#F0A47E;--alarm:#F09B90;--turkus:#7FB3AD;--ok:#7CC46A;--uwaga:#E0A63C;--cien:0 1px 3px rgba(0,0,0,.4)}
/* Biały tekst na jaśniejszej terakocie ciemnego motywu to 3,07:1 — a to jest
   GŁÓWNY przycisk modułu. Ciemny tekst na tym samym tle daje 5,8:1.
   Warianty `.drugi` i `.niebezpieczny` mają wyższą specyficzność i własny
   kolor wyżej, więc ta reguła ich nie tyka. */
.przycisk{color:#1B1512}
header a{background:linear-gradient(145deg,#33291B,#3A2418)}.hero{background:linear-gradient(145deg,#3A2418,var(--karta) 64%)}.ruch{background:linear-gradient(145deg,#3A2418,var(--karta))}.plakietka{background:#3A2418}.profil-mapa div,.petla span{background:var(--tlo2)}textarea{background:var(--tlo2)}.pamiec{background:linear-gradient(145deg,rgba(44,70,67,.42),var(--karta) 62%)}.alterbake{background:linear-gradient(145deg,rgba(90,44,26,.42),var(--karta) 62%)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
/* Tryb wysokiego kontrastu miał JASNY taupe i jasną linię — poprawne, dopóki
   moduł był ciemnym czytnikiem. Po przejściu na papier ta sama reguła stała
   ostatnia w pliku, więc wygrywała też w motywie jasnym i schodziła z 5,97:1
   do 1,36:1: człowiek, który świadomie włączył „Zwiększ kontrast", tracił cały
   drugi plan i etykiety dolnego paska. Odtąd każdy motyw ma własne wartości. */
@media(prefers-contrast:more){:root{--cichy:#3D3A33;--linia:#8C7B66}.karta,.lekcja,.prog{border-width:2px}}
@media(prefers-contrast:more) and (prefers-color-scheme:dark){:root{--cichy:#D8CEC4;--linia:#7E6B58}}
</style>
</head>
<body>
<header>
  <a href="./index.html" aria-label="Wróć do Akademii">🥖</a>
  <div><h1 id="naglowek" tabindex="-1">Rzemiosło człowieka</h1><p>Akademia Alterbake · Lekcje Mistrza</p></div>
</header>
<main id="ekran"></main>
<nav id="nav">
  <button data-widok="sciezka" class="aktywny"><span>◇</span>Warsztat</button>
  <button data-widok="praktyka"><span>◉</span>Próby</button>
  <button data-widok="wszystkie"><span>▦</span>Lekcje</button>
  <!-- Nie przełącza widoku — wychodzi z modułu do Kursu rzemiosła.
       03.09.2026, Piotr: oba moduły osiągalne z każdego miejsca. -->
  <a href="./"><span>📚</span>Kurs</a>
</nav>

   decyzją Piotra 16.09.2026 i nie wolno ich odwrócić bez jego słowa:

   1. JĘZYK DOSŁOWNY. Żart, który nie niesie treści, wypada. Wcześniej
      tekst miał wtręty w rodzaju „nawet sól zna lepsze proporcje" albo
      „próg macha z politowaniem" — brzmiały dobrze i nie mówiły nic,
      a stały w miejscu, z którego czytelnik bierze wniosek. Metafora
      zostaje wyłącznie w polu `kotwica`, bo tam opisuje obrazek.

   2. ŻADNE DWIE ODPOWIEDZI TEGO SAMEGO KSZTAŁTU. Do 16.09 dziesięć
      z czternastu odpowiedzi było listą trzech elementów po półpauzie,
      a pięć pytań zaczynało się od „Jakie trzy…". Każda lekcja z osobna
      przechodziła test odtworzenia; komplet się zlewał — po pięciu
      lekcjach człowiek odtwarzał JAKĄŚ triadę, nie tę pasującą do
      sytuacji. Dlatego pytania mają dziś różne formy: sytuacja,
      rozpoznanie błędu, rozróżnienie pary, dokończenie zdania.
      Dwie lekcje mówiące o domykaniu (`zamknij-zanim-otworzysz`
      i `wlasciciel-wyniku`) pytają WPROST o różnicę między sobą —
      bo to właśnie ta para się myliła.

   3. SEKCJA `alterbake` NIE JEDZIE DO PUBLICZNEJ AKADEMII. Lekcja uczy
      sytuacji ogólnej; przełożenie na piekarnię jest osobnym polem
      i zostaje po naszej stronie. Publiczny generator je zdejmuje
      i przerywa budowę, gdy cokolwiek z zakładu przecieknie —
      pilnuje tego generator modułu. UWAGA: ten komentarz jedzie do
      publicznego pliku razem z danymi, więc nie wolno tu wpisywać
      ścieżek w repo ani nazw naszych dokumentów (16.09.2026 strażnik
      publikacji zatrzymał budowę właśnie za taką ścieżkę). W polu
      opisujemy WYŁĄCZNIE sytuacje: zero temperatur, godzin, cen,
      modeli sprzętu i imion. Wymyślony parametr w materiale
      szkoleniowym to realna szkoda, a tych liczb nie ma w źródłach. */
(function (root, factory) {
  var dane = factory();
  if (typeof module === 'object' && module.exports) module.exports = dane;
  root.AlterbakeMistrzDane = dane;

     ani ukrywania: czego nie ma w danych, tego nie ma na ekranie. */
  function kartaAlterbake(l){
    if(!l.alterbake) return null;
    var k=karta('alterbake');k.append(el('div','nadtytul','Z ŻYCIA ALTERBAKE'));
    k.append(el('h3','','Jak to wygląda u nas'));
    k.append(el('p','',l.alterbake));
    return k;
  }

  function ekranLekcji(id){
    wyczysc();var l=lekcjaPoId(id);if(!l){nawiguj('sciezka',null,true);return}var p=progPoId(l.prog),tryb=L.trybUczenia(profil());ustawTytul(l.tytul);
    var h=karta('hero');h.append(el('div','nadtytul','Próg '+p.nr+' · '+p.nazwa+' · '+p.symbol));h.append(el('h2','',l.tytul));h.append(el('p','ostra',l.ostrze));
    var meta=el('div','meta');meta.append(el('span','plakietka',l.czas+' min'),el('span','plakietka','1 ruch'),el('span','plakietka',tryb.nazwa));var st=statusLekcji(id);if(st)meta.append(el('span','plakietka '+st.klasa,st.tekst));h.append(meta);ekran.append(h,figura(p,l.kotwica));
    if(tryb.id==='dzialanie')ekran.append(kartaRuchu(l,id),kartaMapy(l));else ekran.append(kartaMapy(l),kartaRuchu(l,id));
    ekran.append(kartaPamieci(l));
    var ka=kartaAlterbake(l);if(ka)ekran.append(ka);
    ekran.append(przycisk('← Wróć do progu',function(){nawiguj('prog',l.prog)},true));
  }

  function ekranPlanu(id){
    wyczysc();var l=lekcjaPoId(id),aktywna=L.aktywnaProba(stan());if(!l){nawiguj('sciezka',null,true);return}if(aktywna){nawiguj('praktyka',null,true);return}ustawTytul('Zaplanuj próbę');
    var h=karta('hero');h.append(el('div','nadtytul','Jedna zmiana · jeden dowód'));h.append(el('h2','',l.tytul));h.append(el('p','ostra',l.ruch));ekran.append(h);
    var f=karta('formularz');f.append(el('h3','','Gdzie sprawdzisz ten ruch?'));f.append(el('p','cichy','Zapis zostaje wyłącznie w tej przeglądarce. Nie wpisuj danych klientów ani informacji wrażliwych.'));
    var lab=el('label','', '');lab.textContent='Kontekst próby (opcjonalnie)';var ta=el('textarea');ta.placeholder='Np. przekazanie zadania na końcu zmiany…';f.append(lab,ta);
    f.append(przycisk('Zapisz próbę',function(){
      var s=L.dopiszProbe(stan(),{lekcjaId:id,kontekst:ta.value,status:'plan'});zapiszStan(s);nawiguj('praktyka');
    }));ekran.append(f);
    ekran.append(przycisk('Anuluj',function(){nawiguj('lekcja',id)},true));
  }

  function kartaProby(p){
    var l=lekcjaPoId(p.lekcjaId);if(!l)return null;
    var kl=p.status==='plan'?'plan':(p.status==='dziala'||p.status==='czesciowo'?'czesc':'');
    var k=karta('proba '+kl);k.append(el('div','nadtytul',p.status==='plan'?'Próba w toku':'Zapis próby'));k.append(el('h3','',l.tytul));
    if(p.kontekst)k.append(el('p','',p.kontekst));k.append(el('p','cichy mini',new Date(p.utworzono).toLocaleDateString('pl-PL')));
    if(p.status==='plan'){
      var lab=el('label','cichy mini','Dowód: zachowanie → reakcja → skutek');var ta=el('textarea');ta.placeholder='Co dokładnie zrobiłeś? Co dało się zobaczyć lub usłyszeć? Jaki był skutek? Minimum '+L.MIN_DOWOD+' znaki.';ta.value=p.dowod||'';var blad=el('p','blad');blad.setAttribute('aria-live','polite');k.append(lab,ta,blad);
      var a=el('div','akcje');[['działało','dziala'],['częściowo','czesciowo'],['nie zadziałało','nie']].forEach(function(x){
        var b=el('button','',x[0]);b.type='button';b.onclick=function(){if(ta.value.trim().length<L.MIN_DOWOD){blad.textContent='Najpierw zapisz konkretny dowód. Sama ocena wyniku nie kończy próby.';ta.focus();return}var s=L.aktualizujProbe(stan(),p.id,{status:x[1],dowod:ta.value});zapiszStan(s);rysuj()};a.append(b)
      });k.append(a);
    }else{
      var nazwy={dziala:'Działało',czesciowo:'Częściowo',nie:'Nie zadziałało'};k.append(el('span','plakietka '+(p.status==='nie'?'uwaga':'ok'),nazwy[p.status]));if(p.dowod)k.append(el('p','powod',p.dowod));
    }
    var usun=przycisk('Usuń ten lokalny zapis',function(){if(window.confirm('Usunąć tę próbę z tej przeglądarki?')){zapiszStan(L.usunProbe(stan(),p.id));rysuj()}},true);usun.classList.add('niebezpieczny');k.append(usun);
    return k;
  }

  function ekranPraktyki(){
    wyczysc();ustawTytul('Praktyka');var s=stan(),proby=s.proby.slice().reverse();
    var h=karta('hero');h.append(el('div','nadtytul','Dowody zamiast odznak'));h.append(el('h2','','Co zmieniło zachowanie?'));h.append(el('p','ostra','Jedna próba daje historię. Trzy próby zaczynają dawać wzorzec.'));h.append(el('p','cichy','„Przetestowane” oznacza tylko: co najmniej trzy zakończone próby, z czego dwie były użyteczne. Nie zmienia wyniku Profilu i nie ocenia człowieka.'));ekran.append(h);
    if(!proby.length){var p=el('div','karta pusty','Nie ma jeszcze prób. Otwórz lekcję i zabierz jeden ruch na zmianę.');ekran.append(p);return}
    proby.forEach(function(p){var k=kartaProby(p);if(k)ekran.append(k)});
  }

  function ekranWszystkich(){
    wyczysc();ustawTytul('Wszystkie lekcje');var h=karta('hero');h.append(el('div','nadtytul',D.lekcje.length+' lekcji · 7 progów'));h.append(el('h2','','Biblioteka ruchów'));h.append(el('p','cichy','Profil układa punkt startu. Biblioteka zostaje otwarta, bo człowiek nie jest zakładnikiem wyniku testu.'));ekran.append(h);
    D.progi.forEach(function(p){var n=el('div','nadtytul',p.nr+' · '+p.symbol+' · '+p.nazwa);ekran.append(n);var s=el('div','siatka');D.lekcje.filter(function(l){return l.prog===p.id}).forEach(function(l){s.append(guzikLekcji(l))});ekran.append(s)});
  }

  function aktywujNav(){
    var n=widok.nazwa==='praktyka'?'praktyka':widok.nazwa==='wszystkie'?'wszystkie':'sciezka';
    /* aria-current, nie sama klasa: kolor mówi, gdzie jesteś, tylko oczom. */
    document.querySelectorAll('#nav button').forEach(function(b){
      var tu=b.dataset.widok===n;b.classList.toggle('aktywny',tu);
      if(tu)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
  }
  function rysuj(){
    aktywujNav();
    if(widok.nazwa==='sciezka')ekranSciezka();
    else if(widok.nazwa==='prog')ekranProgu(widok.id);
    else if(widok.nazwa==='lekcja')ekranLekcji(widok.id);
    else if(widok.nazwa==='plan')ekranPlanu(widok.id);
    else if(widok.nazwa==='praktyka')ekranPraktyki();
    else if(widok.nazwa==='wszystkie')ekranWszystkich();
  }
  document.querySelectorAll('#nav button').forEach(function(b){b.type='button';b.onclick=function(){nawiguj(b.dataset.widok)}});
  window.addEventListener('popstate',function(){widok=widokZAdresu();rysuj();przeniesFokus()});
  widok=widokZAdresu();rysuj();
})();
</script>
</body>
</html>
