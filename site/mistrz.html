<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<title>Lekcje Mistrza · Akademia Alterbake</title>
<style>
:root{
  --tlo:#12100e;--karta:#1c1916;--karta2:#25201b;--tekst:#f0ebe4;--cichy:#aaa097;
  --linia:#3b332c;--akcent:#c87d3a;--akcent2:#e2a46c;--ok:#66b982;--uwaga:#d7a34c;
  --r:15px;--cien:0 16px 40px rgba(0,0,0,.18)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tlo);color:var(--tekst);font:16px/1.55 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button,a,textarea{font:inherit}
button,a{touch-action:manipulation}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(18,16,14,.94);border-bottom:1px solid var(--linia);backdrop-filter:blur(12px)}
header a{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--linia);border-radius:11px;color:var(--tekst);text-decoration:none}
header div{min-width:0;flex:1}
header h1{font:700 16px/1.2 inherit;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header p{margin:2px 0 0;color:var(--cichy);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
main{max-width:760px;margin:0 auto;padding:16px}
.karta{background:var(--karta);border:1px solid var(--linia);border-radius:var(--r);padding:17px;margin-bottom:12px;box-shadow:var(--cien)}
.hero{padding:22px 18px;background:linear-gradient(145deg,rgba(200,125,58,.19),rgba(28,25,22,.96) 56%)}
.nadtytul{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--akcent2);font-weight:700;margin-bottom:8px}
h2{font:750 clamp(25px,7vw,38px)/1.08 inherit;letter-spacing:-.035em;margin:0 0 12px}
h3{font:700 17px/1.3 inherit;margin:0 0 7px}
p{margin:0 0 11px}
p:last-child{margin-bottom:0}
.cichy{color:var(--cichy);font-size:14px}
.mini{font-size:12px}
.ostra{font-size:18px;line-height:1.45;border-left:4px solid var(--akcent);padding-left:13px;margin:15px 0}
.plakietka{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:rgba(200,125,58,.13);color:var(--akcent2);font-size:11px;font-weight:700}
.plakietka.ok{background:rgba(102,185,130,.14);color:var(--ok)}
.plakietka.uwaga{background:rgba(215,163,76,.14);color:var(--uwaga)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 0}
.przycisk{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:11px 14px;border-radius:12px;border:1px solid var(--akcent);background:var(--akcent);color:#17120d;text-decoration:none;font-weight:800;cursor:pointer;margin-top:10px}
.przycisk.drugi{background:transparent;color:var(--tekst);border-color:var(--linia)}
.przycisk.maly{width:auto;min-height:42px;margin:0;padding:9px 12px;font-size:13px}
.siatka{display:grid;gap:10px}
.lekcja,.prog{width:100%;text-align:left;background:var(--karta);color:var(--tekst);border:1px solid var(--linia);border-radius:13px;padding:15px;cursor:pointer}
.lekcja:hover,.prog:hover{border-color:var(--akcent)}
.lekcja .glowa,.prog .glowa{display:flex;gap:10px;align-items:flex-start}
.numer{flex:none;color:var(--akcent2);font-weight:800;min-width:28px}
.lekcja b,.prog b{display:block;font-size:15px;line-height:1.3}
.lekcja p,.prog p{margin:6px 0 0;color:var(--cichy);font-size:13px}
.powod{margin-top:10px;padding-top:10px;border-top:1px solid var(--linia);font-size:12px;color:var(--akcent2)}
.sekcja{position:relative;padding-top:19px}
.sekcja .etykieta{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--akcent2);font-weight:800;margin-bottom:8px}
.sekcja+.sekcja{border-top:1px solid var(--linia);margin-top:17px}
.sekcja p{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.62}
.ruch{background:rgba(200,125,58,.11);border:1px solid rgba(200,125,58,.42)}
.ruch .duzy{font-size:20px;line-height:1.4;font-weight:700}
.progi{display:grid;grid-template-columns:1fr;gap:9px}
.tryb{display:flex;align-items:flex-start;gap:10px}
.tryb .znak{font-size:22px;color:var(--akcent2)}
.formularz label{display:block;font-size:12px;color:var(--cichy);margin-bottom:6px}
textarea{width:100%;min-height:96px;resize:vertical;background:var(--karta2);color:var(--tekst);border:1px solid var(--linia);border-radius:11px;padding:12px;font-size:15px;line-height:1.5}
textarea:focus{outline:2px solid var(--akcent);outline-offset:2px}
.proba{border-left:4px solid var(--linia)}
.proba.plan{border-left-color:var(--uwaga)}
.proba.dziala,.proba.czesc{border-left-color:var(--ok)}
.akcje{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.akcje button{flex:1 1 120px;min-height:42px;border:1px solid var(--linia);border-radius:10px;background:var(--karta2);color:var(--tekst);cursor:pointer}
.akcje button:hover{border-color:var(--akcent)}
.pusty{text-align:center;padding:32px 18px;color:var(--cichy)}
nav{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;background:rgba(28,25,22,.96);border-top:1px solid var(--linia);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}
nav button{flex:1;min-height:62px;border:0;background:none;color:var(--cichy);font-size:12px;cursor:pointer}
nav button.aktywny{color:var(--akcent2);font-weight:800}
.ukryty{display:none!important}
@media(min-width:650px){.progi{grid-template-columns:1fr 1fr}.siatka.rekomendacje{grid-template-columns:repeat(3,1fr)}.lekcja{height:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<script>(function (root, factory) {

  var PROGI = [
    { id: 'mgla', nr: 'I', nazwa: 'Widzenie mgły', opis: 'Oddziel fakt od opowieści, zanim zaczniesz naprawiać nie ten problem.' },
    { id: 'ostrze', nr: 'II', nazwa: 'Własne ostrze', opis: 'Używaj przewagi świadomie i pilnuj cienia, który idzie za nią.' },

    { id: 'natchnienie', nr: 'VII', nazwa: 'Natchnienie', opis: 'Zamieniaj pomysł w mały dowód. Entuzjazm jest zapłonem, nie kierownicą.' }
  ];

  var LEKCJE = [
    {
      id: 'fakt-przed-opowiescia', prog: 'mgla', tytul: 'Fakt przed opowieścią', czas: 4,
      ostrze: 'Nie rozwiązuj opowieści. Najpierw znajdź fakt.',
      pole: 'Na zmianie pada zdanie: „nikt nigdy nie przekazuje informacji”. Brzmi jak diagnoza, ale jest tylko dymem. Faktem może być jedno nieprzekazane zadanie, brak potwierdzenia albo ustalenie, którego nikt nie zapisał. Każde wymaga innego ruchu.',
      wrog: 'Pewność zbudowana z tonu głosu. Człowiek mówi głośno, mózg dopisuje dowody. Stary numer; ludzkość ćwiczy go od ogniska i nadal nie zaliczyła egzaminu.',
      cena: 'Naprawiasz charakter człowieka, choć zepsuło się przekazanie. Rośnie napięcie, a problem wraca w nowym ubraniu.',
      ruch: 'Przed reakcją zapisz trzy linie: CO WIEM — CO DOPOWIADAM — CO SPRAWDZĘ. Wykonaj tylko trzecią linię.',
      integracja: 'Przy najbliższym mocnym osądzie zatrzymaj się na 60 sekund. Nazwij jeden obserwowalny fakt i jedno pytanie, które rozstrzyga sytuację.',
      reszta: 'Intencje, „zawsze”, „nigdy” i sąd nad całym człowiekiem po jednym zdarzeniu.',
      przyklad: '„Nie dostałem potwierdzenia przekazania o 9:10. Czy zadanie zostało przyjęte, czy utknęło między nami?”',
      rozwoj: { trenuje: ['problemSolving', 'communication', 'integrity'], wzmacnia: ['problemSolving'], rownowazy: ['influence', 'empathy', 'purpose'] }
    },
    {
      id: 'zdarzenie-to-nie-wzorzec', prog: 'mgla', tytul: 'Zdarzenie to nie wzorzec', czas: 3,
      ostrze: 'Jedna wpadka wymaga korekty. Wzorzec wymaga zmiany systemu. Nie myl tych rachunków.',
      pole: 'Błąd pojawia się pierwszy raz, ale jest kosztowny. Pokusa każe od razu tworzyć procedurę, szkolenie i zakaz. Druga pokusa każe machnąć ręką, bo „każdemu się zdarza”. Obie są leniwe — jedna produkuje papier, druga powtórki.',
      wrog: 'Pamięć, która liczy emocje zamiast przypadków. Trzy ciche sukcesy przegrywają z jednym głośnym błędem.',
      cena: 'Albo obciążasz wszystkich kontrolą po jednym incydencie, albo ignorujesz sygnał, który właśnie zaczął się powtarzać.',
      ruch: 'Oznacz zdarzenie jako PIERWSZE / POWTÓRKA / WZORZEC. Przy pierwszym — korekta i zapis. Przy powtórce — szukanie wspólnej przyczyny. Przy wzorcu — właściciel zmiany i termin sprawdzenia.',
      integracja: 'Przez tydzień zbierz trzy przykłady, zanim nazwiesz coś „zawsze”. Jeśli trzeciego nie ma, język też ma nie udawać, że jest.',
      reszta: 'Diagnozy typu „taki już jest” i procesy pisane w odwecie.',
      przyklad: '„To drugi podobny przypadek w pięć dni. Sprawdźmy wspólny moment, nie polujmy na winnego.”',

    {

      ostrze: 'Talent użyty bez miary staje się wadą z dobrym PR-em.',
      pole: 'Dokładność może chronić jakość albo zatrzymać tempo. Empatia może budować zaufanie albo odkładać trudną rozmowę. Inicjatywa może ulepszać pracę albo urządzać innym życie bez zaproszenia. To samo ostrze; różni się chwyt.',

      integracja: 'Poproś jedną osobę o konkretny przykład, kiedy Twoja mocna strona pomogła i kiedy przesadziła. Bez obrony. Obrona jest bezpłatna, dlatego ludzie nadużywają jej jak folii spożywczej.',

      integracja: 'W jednym zadaniu zastosuj format 3×1: jedno zdanie stanu, jedno ryzyka, jedna konkretna prośba.',
      reszta: 'Heroizm, który istnieje głównie dlatego, że informacja przyszła za późno.',
      przyklad: '„Jestem w połowie. Brakuje decyzji X; bez niej termin jest zagrożony. Potrzebuję odpowiedzi do 12:00.”',
      rozwoj: { trenuje: ['communication', 'collaboration', 'reliability'], wzmacnia: ['initiative'], rownowazy: ['independence', 'resilience', 'standards'] }

    {
      id: 'jedno-tak-jeden-koszt', prog: 'cena', tytul: 'Jedno „tak”, jeden koszt', czas: 3,
      ostrze: 'Nowe zadanie nie wchodzi do pustego dnia. Wypycha coś, tylko zwykle po cichu.',
      pole: 'Pojawia się dobry pomysł, pilna prośba albo drobna poprawka. Każda osobno wygląda niewinnie. Razem zjadają margines, a potem wszyscy są zaskoczeni, że doba nie została powiadomiona o zmianie planu.',

      cena: 'Niedomknięte zadania, chaotyczne przekazania i obietnice, których nikt świadomie nie wycofał.',
      ruch: 'Przyjmując nowe zadanie, nazwij od razu: CO SCHODZI, KTO DECYDUJE, KIEDY WRACAMY. Jeśli nic nie schodzi, to nie decyzja — to życzenie.',
      integracja: 'Przez jedną zmianę nie przyjmuj żadnego nowego „na chwilę” bez wskazania kosztu.',
      reszta: 'Lista rzeczy „też ważnych”, hodowana jak kolekcja rachunków bez terminu płatności.',

    {

      rozwoj: { trenuje: ['reliability', 'initiative'], wzmacnia: ['reliability'], rownowazy: ['curiosity', 'initiative', 'flexibility', 'drive'] }
    },
    {
      id: 'sygnal-przed-progiem', prog: 'cialo', tytul: 'Sygnał przed progiem', czas: 4,

      pole: 'Przeciążenie rzadko zaczyna się od krzyku. Wcześniej ciało przyspiesza, oddech robi się płytki, zdania krótsze, dłonie zaciskają się albo znika zdolność słuchania. To są dane operacyjne o Tobie, nie wada moralna.',

      integracja: 'Przez trzy dni zanotuj: sytuacja — pierwszy sygnał — reakcja — skutek. Bez diagnozowania siebie.',
      reszta: 'Wielkie obietnice, że „następnym razem będę spokojny”. To nie plan, tylko literatura.',
      przyklad: '„Mówię coraz szybciej — to mój sygnał. Robię dwie minuty przerwy i wracam z jednym pytaniem.”',
      rozwoj: { trenuje: ['pressure', 'communication'], wzmacnia: ['pressure'], rownowazy: ['regulation', 'resilience', 'drive', 'asertywnosc'] }
    },
    {
      id: 'pauza-przed-odpowiedzia', prog: 'cialo', tytul: 'Pauza przed odpowiedzią', czas: 2,

      rozwoj: { trenuje: ['pressure', 'communication', 'collaboration'], wzmacnia: ['pressure'], rownowazy: ['asertywnosc', 'influence', 'optymizm'] }
    },
    {

      ? (rec.spersonalizowane?'Jeden ruch opiera się na zasobie, drugi pilnuje cienia mocnej strony, trzeci sprawdza obszar tarcia.':'Wiarygodność tej próbki jest niska. Nie udajemy precyzji — najpierw zbieramy zachowania.')
      : 'Test zwiększa trafność startu, ale nie jest bramką. Brak kwestionariusza nie zwalnia z patrzenia na rzeczywistość.'));
    var tr=el('div','tryb'); tr.append(el('div','znak','↳'),el('div','',rec.tryb.nazwa+' · '+rec.tryb.opis)); pk.append(tr);
    if(!pr){var a=el('a','przycisk drugi','Zrób Profil Alterbake →');a.href='./test/';pk.append(a)}
    ekran.append(pk);

    var t=el('div','nadtytul','Rekomendowany start'); ekran.append(t);
    var s=el('div','siatka rekomendacje'); rec.pozycje.forEach(function(x){s.append(guzikLekcji(x.lekcja,x.typ.toUpperCase()+' · '+x.powod))}); ekran.append(s);

    var nag=karta(); nag.append(el('div','nadtytul','Pełna ścieżka')); nag.append(el('h3','','Siedem progów, nie siedem poziomów człowieka'));
    nag.append(el('p','cichy','Nie przechodzisz ich raz na zawsze. Wracasz do właściwego progu, kiedy sytuacja tego wymaga. Rozwój lubi pętle; tylko prezentacje lubią schody.'));
    ekran.append(nag);
    var progi=el('div','progi'); D.progi.forEach(function(p){
      var b=el('button','prog'),g=el('div','glowa');g.append(el('span','numer',p.nr),el('b','',p.nazwa));b.append(g,el('p','',p.opis));
      b.onclick=function(){widok={nazwa:'prog',id:p.id};rysuj()};progi.append(b);
    }); ekran.append(progi);
  }

  function ekranProgu(id){
    wyczysc();var p=progPoId(id);ustawTytul(p.nazwa);
    var h=karta('hero');h.append(el('div','nadtytul','Próg '+p.nr));h.append(el('h2','',p.nazwa));h.append(el('p','ostra',p.opis));ekran.append(h);
    var s=el('div','siatka');D.lekcje.filter(function(l){return l.prog===id}).forEach(function(l){s.append(guzikLekcji(l))});ekran.append(s);
    ekran.append(przycisk('← Wróć do ścieżki',function(){widok={nazwa:'sciezka'};rysuj()},true));
  }

  function ekranLekcji(id){
    wyczysc();var l=lekcjaPoId(id),p=progPoId(l.prog);ustawTytul(l.tytul);
    var h=karta('hero');h.append(el('div','nadtytul','Próg '+p.nr+' · '+p.nazwa));h.append(el('h2','',l.tytul));h.append(el('p','ostra',l.ostrze));
    var meta=el('div','meta');meta.append(el('span','plakietka',l.czas+' min'),el('span','plakietka','1 ruch'));var st=statusLekcji(id);if(st)meta.append(el('span','plakietka '+st.klasa,st.tekst));h.append(meta);ekran.append(h);
    var k=karta();sekcja(k,'POLE',l.pole);sekcja(k,'WRÓG',l.wrog);sekcja(k,'CENA',l.cena);sekcja(k,'PRZYKŁAD',l.przyklad);ekran.append(k);
    var r=karta('ruch');r.append(el('div','nadtytul','RUCH'));r.append(el('p','duzy',l.ruch));sekcja(r,'INTEGRACJA',l.integracja);sekcja(r,'RESZTA TO MGŁA',l.reszta);r.append(przycisk('Zabierz ten ruch na zmianę →',function(){widok={nazwa:'plan',id:id};rysuj()}));ekran.append(r);
    ekran.append(przycisk('← Wróć',function(){widok={nazwa:'prog',id:l.prog};rysuj()},true));
  }

  function ekranPlanu(id){
    wyczysc();var l=lekcjaPoId(id);ustawTytul('Zaplanuj próbę');
    var h=karta('hero');h.append(el('div','nadtytul','Jedna zmiana · jeden dowód'));h.append(el('h2','',l.tytul));h.append(el('p','ostra',l.ruch));ekran.append(h);
    var f=karta('formularz');f.append(el('h3','','Gdzie sprawdzisz ten ruch?'));f.append(el('p','cichy','Zapis zostaje wyłącznie w tej przeglądarce. Nie wpisuj danych klientów ani informacji wrażliwych.'));
    var lab=el('label','', '');lab.textContent='Kontekst próby (opcjonalnie)';var ta=el('textarea');ta.placeholder='Np. przekazanie zadania na końcu zmiany…';f.append(lab,ta);
    f.append(przycisk('Zapisz próbę',function(){
      var s=L.dopiszProbe(stan(),{lekcjaId:id,kontekst:ta.value,status:'plan'});zapiszStan(s);widok={nazwa:'praktyka'};rysuj();
    }));ekran.append(f);
    ekran.append(przycisk('Anuluj',function(){widok={nazwa:'lekcja',id:id};rysuj()},true));
  }

  function kartaProby(p){
    var l=lekcjaPoId(p.lekcjaId);if(!l)return null;
    var kl=p.status==='plan'?'plan':(p.status==='dziala'||p.status==='czesciowo'?'czesc':'');
    var k=karta('proba '+kl);k.append(el('div','nadtytul',p.status==='plan'?'Próba w toku':'Zapis próby'));k.append(el('h3','',l.tytul));
    if(p.kontekst)k.append(el('p','',p.kontekst));k.append(el('p','cichy mini',new Date(p.utworzono).toLocaleDateString('pl-PL')));
    if(p.status==='plan'){
      var lab=el('label','cichy mini','Co faktycznie się stało?');var ta=el('textarea');ta.placeholder='Jeden obserwowalny dowód, nie ocena człowieka.';ta.value=p.dowod||'';k.append(lab,ta);
      var a=el('div','akcje');[['działało','dziala'],['częściowo','czesciowo'],['nie zadziałało','nie']].forEach(function(x){
        var b=el('button','',x[0]);b.onclick=function(){var s=L.aktualizujProbe(stan(),p.id,{status:x[1],dowod:ta.value});zapiszStan(s);rysuj()};a.append(b)
      });k.append(a);
    }else{
      var nazwy={dziala:'Działało',czesciowo:'Częściowo',nie:'Nie zadziałało'};k.append(el('span','plakietka '+(p.status==='nie'?'uwaga':'ok'),nazwy[p.status]));if(p.dowod)k.append(el('p','powod',p.dowod));
    }
    return k;
  }

  function ekranPraktyki(){
    wyczysc();ustawTytul('Praktyka');var s=stan(),proby=s.proby.slice().reverse();
    var h=karta('hero');h.append(el('div','nadtytul','Dowody zamiast odznak'));h.append(el('h2','','Co przeszło próbę pracy?'));h.append(el('p','ostra','Trzy próby mówią więcej niż jedno „rozumiem”. Nadal nie czynią z nikogo mistrza. Spokojnie, korona poczeka.'));h.append(el('p','cichy','Status „przetestowane” oznacza wyłącznie: co najmniej trzy zakończone próby, z czego dwie dały użyteczny wynik. Nie zmienia automatycznie Profilu Alterbake.'));ekran.append(h);
    if(!proby.length){var p=el('div','karta pusty','Nie ma jeszcze prób. Otwórz lekcję i zabierz jeden ruch na zmianę.');ekran.append(p);return}
    proby.forEach(function(p){var k=kartaProby(p);if(k)ekran.append(k)});
  }

  function ekranWszystkich(){
    wyczysc();ustawTytul('Wszystkie lekcje');var h=karta('hero');h.append(el('div','nadtytul',D.lekcje.length+' lekcji · 7 progów'));h.append(el('h2','','Biblioteka ruchów'));h.append(el('p','cichy','Profil układa punkt startu. Biblioteka zostaje otwarta, bo człowiek nie jest zakładnikiem wyniku testu.'));ekran.append(h);
    D.progi.forEach(function(p){var n=el('div','nadtytul',p.nr+' · '+p.nazwa);ekran.append(n);var s=el('div','siatka');D.lekcje.filter(function(l){return l.prog===p.id}).forEach(function(l){s.append(guzikLekcji(l))});ekran.append(s)});
  }

  function aktywujNav(){
    var n=widok.nazwa==='praktyka'?'praktyka':widok.nazwa==='wszystkie'?'wszystkie':'sciezka';
    document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('aktywny',b.dataset.widok===n)});
  }
  function rysuj(){
    aktywujNav();
    if(widok.nazwa==='sciezka')ekranSciezka();
    else if(widok.nazwa==='prog')ekranProgu(widok.id);
    else if(widok.nazwa==='lekcja')ekranLekcji(widok.id);
    else if(widok.nazwa==='plan')ekranPlanu(widok.id);
    else if(widok.nazwa==='praktyka')ekranPraktyki();
    else if(widok.nazwa==='wszystkie')ekranWszystkich();
  }
  document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){widok={nazwa:b.dataset.widok};rysuj()}});
  rysuj();
})();
</script>
</body>
</html>
