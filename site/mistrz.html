<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akademia Alterbake</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🥖</text></svg>">
<!-- STARY ADRES RZEMIOSŁA CZŁOWIEKA — została z niego sama tabliczka.

     Do 20.09.2026 pod `mistrz.html` stał osobny moduł „Rzemiosło człowieka"
     (czternaście lekcji w siedmiu progach, własny pasek nawigacji, własny
     zapis prób). Decyzją Piotra wszedł do kursu jako ścieżka „Komunikacja
     i relacje" — cztery moduły w tym samym pliku co reszta Akademii, z tymi
     samymi pytaniami sprawdzającymi i tą samą zakładką „Mój profil".

     Adres był rozdany (kurs linkował `#lekcja=<id>` z dziesięciu modułów,
     Profil wysyłał tu po raporcie), więc tabliczka nie tylko przekierowuje:
     mapę lekcja → moduł i rozdział wstawia generator kursu, żeby stary link
     trafił w ten sam tekst, tylko w nowym miejscu. Bez skryptu zostaje meta
     refresh na stronę główną i zwykły link niżej. -->
<meta http-equiv="refresh" content="1; url=./">
<style>
  :root { color-scheme: light dark }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; padding:24px }
  a { color:inherit }
</style>
</head>
<body>
  <main>
    <p style="font-size:48px" aria-hidden="true">🥖</p>
    <h1>Rzemiosło człowieka jest teraz w kursie</h1>
    <p>Te lekcje to dziś ścieżka „Komunikacja i relacje” w Akademii. Za chwilę tam przejdziesz.</p>
    <p><a id="dalej" href="./#sciezka=komunikacja">Otwórz Akademię →</a></p>
  </main>
<script>
(function () {
  var MAPA = {"fakt-przed-opowiescia":{"modul":"tom-fakty-i-mocne-strony","rozdzial":"fakt-przed-opowiescia"},"zdarzenie-to-nie-wzorzec":{"modul":"tom-fakty-i-mocne-strony","rozdzial":"zdarzenie-to-nie-wzorzec"},"przewaga-ma-cien":{"modul":"tom-fakty-i-mocne-strony","rozdzial":"przewaga-ma-cien"},"pomoc-przed-sciana":{"modul":"tom-fakty-i-mocne-strony","rozdzial":"pomoc-przed-sciana"},"jedno-tak-jeden-koszt":{"modul":"tom-wlasny-rytm-i-przeciazenie","rozdzial":"jedno-tak-jeden-koszt"},"zamknij-zanim-otworzysz":{"modul":"tom-wlasny-rytm-i-przeciazenie","rozdzial":"zamknij-zanim-otworzysz"},"sygnal-przed-progiem":{"modul":"tom-wlasny-rytm-i-przeciazenie","rozdzial":"sygnal-przed-progiem"},"pauza-przed-odpowiedzia":{"modul":"tom-wlasny-rytm-i-przeciazenie","rozdzial":"pauza-przed-odpowiedzia"},"powiedziane-nie-znaczy-zrozumiane":{"modul":"tom-jasny-przekaz-i-granice","rozdzial":"powiedziane-nie-znaczy-zrozumiane"},"granica-bez-wykladu":{"modul":"tom-jasny-przekaz-i-granice","rozdzial":"granica-bez-wykladu"},"wlasciciel-wyniku":{"modul":"tom-jasny-przekaz-i-granice","rozdzial":"wlasciciel-wyniku"},"prawo-zatrzymania":{"modul":"tom-odpowiedzialnosc-i-zmiana","rozdzial":"prawo-zatrzymania"},"eksperyment-zamiast-rewolucji":{"modul":"tom-odpowiedzialnosc-i-zmiana","rozdzial":"eksperyment-zamiast-rewolucji"},"naucz-zeby-sprawdzic":{"modul":"tom-odpowiedzialnosc-i-zmiana","rozdzial":"naucz-zeby-sprawdzic"}};
  var m = location.hash.match(/^#lekcja=([^&]+)$/);
  var cel = './#sciezka=komunikacja';
  if (m) {
    var w = MAPA[decodeURIComponent(m[1])];
    if (w) cel = './#modul=' + encodeURIComponent(w.modul) + '&rozdzial=' + encodeURIComponent(w.rozdzial);
  }
  document.getElementById('dalej').href = cel;
  location.replace(cel);
})();
</script>
</body>
</html>
