<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a4b2a">
<title>Akademia Alterbake</title>

<style>
:root{
  --tlo:#faf7f4; --karta:#fff; --tekst:#231c17; --cichy:#6b5f56;
  --akcent:#8a4b2a; --akcent-jasny:#f3e6dd; --ok:#2f7a4d; --zle:#b3352b;
  --ramka:#e6dcd3; --cien:0 1px 3px rgba(35,28,23,.08);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--tlo:#1a1512;--karta:#241d18;--tekst:#f0e8e2;--cichy:#b3a396;
        --akcent:#e0a077;--akcent-jasny:#3a2a20;--ramka:#3a2f27;--cien:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tlo);color:var(--tekst);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#pasek{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--akcent);color:#fff}
#pasek h1{flex:1;font-size:17px;margin:0;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ikona{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;
  min-width:40px;min-height:40px;font-size:18px;cursor:pointer}
main{padding:14px;max-width:760px;margin:0 auto}
.karta{background:var(--karta);border:1px solid var(--ramka);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--cien)}
.karta h2{margin:0 0 6px;font-size:18px}
.karta h3{margin:0 0 10px;font-size:16px;color:var(--akcent)}
.cichy{color:var(--cichy);font-size:14px}
.mini{font-size:13px}
ul.punkty{margin:0;padding-left:20px}
ul.punkty li{margin-bottom:8px}
.mechanizm{margin-top:12px;padding:12px;background:var(--akcent-jasny);border-radius:10px}
.mechanizm h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--akcent)}
.mechanizm p{margin:0;font-size:15px}
.zrodlo{margin-top:10px;font-size:12px;color:var(--cichy);word-break:break-word}
button.glowny{width:100%;min-height:52px;background:var(--akcent);color:#fff;border:0;
  border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
button.drugi{width:100%;min-height:48px;background:transparent;color:var(--akcent);
  border:1.5px solid var(--akcent);border-radius:12px;font-size:15px;cursor:pointer;margin-top:8px}
.lista-tomow{display:grid;gap:10px}
.tom{display:block;width:100%;text-align:left;background:var(--karta);border:1px solid var(--ramka);
  border-radius:var(--r);padding:14px;cursor:pointer;color:inherit;font:inherit}
.tom .naglowek{display:flex;align-items:center;gap:8px;font-weight:600}
.tom .naglowek span.stan{margin-left:auto;font-size:13px;color:var(--cichy);white-space:nowrap}
.pasek{height:6px;background:var(--ramka);border-radius:3px;margin-top:10px;overflow:hidden}
.pasek i{display:block;height:100%;background:var(--ok);border-radius:3px}
.plakietka{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--akcent-jasny);color:var(--akcent);font-weight:600}
.plakietka.ccp{background:#fdeceb;color:var(--zle)}
@media (prefers-color-scheme:dark){.plakietka.ccp{background:#3a201e;color:#f0a29b}}
.sciezki{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.sciezki button{white-space:nowrap;min-height:44px;padding:10px 16px;border-radius:22px;
  border:1.5px solid var(--ramka);background:var(--karta);color:var(--tekst);font-size:14px;cursor:pointer}
.sciezki button.akt{background:var(--akcent);color:#fff;border-color:var(--akcent)}
.opcja{display:block;width:100%;text-align:left;background:var(--karta);border:1.5px solid var(--ramka);
  border-radius:12px;padding:14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer;min-height:52px}
.opcja.wybrana{border-color:var(--akcent);background:var(--akcent-jasny)}
.opcja.ok{border-color:var(--ok);background:rgba(47,122,77,.12)}
.opcja.zle{border-color:var(--zle);background:rgba(179,53,43,.10)}
.opcja:disabled{cursor:default;opacity:1}
.wyjasnienie{margin-top:10px;padding:14px;border-radius:12px;background:var(--akcent-jasny)}
.wyjasnienie h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;color:var(--akcent)}
.wyjasnienie p{margin:0 0 8px;font-size:15px}
#nawigacja{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--karta);
  border-top:1px solid var(--ramka);padding-bottom:env(safe-area-inset-bottom);z-index:10}
#nawigacja button{flex:1;min-height:60px;background:none;border:0;color:var(--cichy);
  font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
#nawigacja button.akt{color:var(--akcent);font-weight:600}
details.slownik{margin-top:12px}
details.slownik summary{cursor:pointer;font-weight:600;padding:12px;background:var(--karta);
  border:1px solid var(--ramka);border-radius:12px;min-height:44px;display:flex;align-items:center}
details.slownik dl{margin:10px 0 0}
details.slownik dt{font-weight:600;margin-top:12px}
details.slownik dd{margin:2px 0 0;font-size:14px;color:var(--cichy)}
input.szukajka{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--ramka);
  border-radius:12px;font-size:16px;background:var(--karta);color:var(--tekst);margin-bottom:12px}
.postep-liczba{font-size:34px;font-weight:700;color:var(--akcent);line-height:1}
.ladowanie{text-align:center;color:var(--cichy);padding:40px 0}
.pyt-licznik{font-size:13px;color:var(--cichy);margin-bottom:6px}
mark{background:var(--akcent-jasny);color:inherit;padding:0 2px;border-radius:3px}

</style>

<script>
/* AKADEMIA ALTERBAKE — aplikacja szkoleniowa (mobile, offline).
   Zero zależności i zero build-stepu: to ma działać z każdego statycznego
   serwera i z telefonu w trybie samolotowym.

   Postęp trzymamy WYŁĄCZNIE pod kluczami `akademia_*` — publiczna Akademia
   dzieli origin z prywatnymi aplikacjami OS i nie wolno jej dotykać wspólnych
   kluczy (decyzja z 09.08.2026, wariant B). */

/* STRAŻNIK PRZESTRZENI KLUCZY. Publiczna Akademia dzieli origin z prywatnymi
   aplikacjami OS, więc zapis pod cudzy klucz to nie stylistyka, tylko wyciek
   albo skasowanie danych zespołu. Prefiks jest tu wymuszany, nie zalecany. */
const PREFIKS = 'akademia_';
const klucz = (k) => {
  if (typeof k !== 'string' || !k.startsWith(PREFIKS)) throw new Error('Akademia zapisuje wyłącznie klucze ' + PREFIKS + '*');
  return k;
};

const KLUCZ_POSTEP = 'akademia_postep_v1';
const KLUCZ_SCIEZKA = 'akademia_sciezka_v1';
const PROG = 0.8;

let DANE = null;
let widok = { nazwa: 'tomy', tom: null, quiz: null };

/* ── magazyn ───────────────────────────────────────────────────────────── */
const czytaj = (k, gdy) => { try { return JSON.parse(localStorage.getItem(klucz(k))) ?? gdy } catch { return gdy } };
const zapisz = (k, v) => { try { localStorage.setItem(klucz(k), JSON.stringify(v)) } catch { /* tryb prywatny */ } };
const postep = () => czytaj(KLUCZ_POSTEP, {});
const zapiszOdpowiedz = (id, dobrze) => { const p = postep(); p[id] = dobrze; zapisz(KLUCZ_POSTEP, p) };

/* ── logika postępu ────────────────────────────────────────────────────────
   Ta sama reguła co w Panelu: procent liczą WYŁĄCZNIE pytania zwykłe,
   pytania CCP mają osobną, binarną ścieżkę i blokują status „opanowany”. */
function policzTom(tom, p) {
  const zwykle = tom.pytania.filter((x) => !x.ccp);
  const ccp = tom.pytania.filter((x) => x.ccp);
  const ok = zwykle.filter((x) => p[x.id] === true).length;
  const ccpOk = ccp.every((x) => p[x.id] === true);
  const procent = zwykle.length ? ok / zwykle.length : (ccpOk ? 1 : 0);
  return {
    ok, zwykle: zwykle.length, ccpPytan: ccp.length, ccpOk, procent,
    stan: !ccpOk ? 'blok' : procent >= PROG ? 'ok' : ok > 0 ? 'toku' : 'start'
  };
}

/* Losowa kolejność — pytań i opcji. Bez tego uczy się pozycji odpowiedzi,
   a nie treści (redteam U-01). */
function przetasuj(t) {
  const a = [...t];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
  return a;
}
function ulozPytanie(p) {
  const idx = przetasuj(p.opcje.map((_, i) => i));
  return { ...p, opcje: idx.map((i) => p.opcje[i]), poprawne: p.poprawne.map((i) => idx.indexOf(i)).sort((a, b) => a - b) };
}

/* ── pomocnicze DOM ────────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const el = (tag, kl, txt) => { const e = document.createElement(tag); if (kl) e.className = kl; if (txt != null) e.textContent = txt; return e };
const norm = (t) => String(t || '').toLowerCase().replace(/[ąćęłńóśźż]/g, (z) => 'acelnoszz'['ąćęłńóśźż'.indexOf(z)]);

function ustawPasek(tytul, zWstecz) {
  $('#tytul').textContent = tytul;
  $('#wstecz').hidden = !zWstecz;
}

/* ── ekran: lista tomów ───────────────────────────────────────────────── */
function ekranTomy() {
  ustawPasek('Akademia Alterbake', false);
  const m = $('#ekran'); m.innerHTML = '';
  const p = postep();
  const wybrana = czytaj(KLUCZ_SCIEZKA, 'wszystkie');

  const paski = el('div', 'sciezki');
  const dodaj = (id, nazwa) => {
    const b = el('button', wybrana === id ? 'akt' : '', nazwa);
    b.onclick = () => { zapisz(KLUCZ_SCIEZKA, id); ekranTomy() };
    paski.append(b);
  };
  dodaj('wszystkie', 'Wszystko');
  DANE.sciezki.forEach((s) => dodaj(s.id, s.nazwa));
  m.append(paski);

  const tomy = DANE.tomy.filter((t) => wybrana === 'wszystkie' || t.sciezki.includes(wybrana));
  if (!tomy.length) { m.append(el('p', 'cichy', 'Brak materiałów w tej ścieżce.')); return }

  const lista = el('div', 'lista-tomow');
  for (const t of tomy) {
    const s = policzTom(t, p);
    const b = el('button', 'tom');
    const nag = el('div', 'naglowek');
    nag.append(el('span', '', s.stan === 'ok' ? '✅' : s.stan === 'toku' ? '🔸' : '📘'));
    nag.append(el('span', '', t.nazwa));
    nag.append(el('span', 'stan', `${s.ok}/${s.zwykle}`));
    b.append(nag);
    const meta = el('div', 'cichy mini');
    meta.textContent = `${t.karty.length} ${t.karty.length === 1 ? 'karta' : 'karty'} · ${t.pytania.length} pytań`;
    if (s.ccpPytan) { meta.append(' '); const pl = el('span', 'plakietka ccp', `CCP ${s.ccpOk ? 'zaliczone' : 'wymagane'}`); meta.append(pl) }
    b.append(meta);
    const pasek = el('div', 'pasek'); const i = el('i'); i.style.width = Math.round(s.procent * 100) + '%'; pasek.append(i); b.append(pasek);
    b.onclick = () => { widok = { nazwa: 'tom', tom: t }; rysuj() };
    lista.append(b);
  }
  m.append(lista);
}

/* ── ekran: materiał tomu ─────────────────────────────────────────────── */
function ekranTom() {
  const t = widok.tom;
  ustawPasek(t.nazwa, true);
  const m = $('#ekran'); m.innerHTML = '';

  if (t.intro) { const k = el('div', 'karta'); k.append(el('span', 'plakietka', 'Materiał do nauki')); k.append(el('h2', '', t.nazwa)); k.append(el('p', '', t.intro)); m.append(k) }

  for (const karta of t.karty) {
    const k = el('div', 'karta');
    k.append(el('h3', '', karta.tytul));
    const ul = el('ul', 'punkty');
    (karta.punkty || []).forEach((x) => ul.append(el('li', '', x)));
    k.append(ul);
    if (karta.mechanizm) {
      const mech = el('div', 'mechanizm');
      mech.append(el('h4', '', 'Jak to działa'));
      mech.append(el('p', '', karta.mechanizm));
      k.append(mech);
    }
    if (karta.zrodlo) k.append(el('div', 'zrodlo', 'Źródło: ' + karta.zrodlo));
    m.append(k);
  }

  if (t.pojecia.length) {
    const d = el('details', 'slownik');
    const s = el('summary', '', `📖 Słownik — ${t.pojecia.length} pojęć z tego materiału`);
    d.append(s);
    const dl = el('dl');
    for (const p of t.pojecia) {
      dl.append(el('dt', '', p.termin + (p.rozwiniecie ? ` — ${p.rozwiniecie}` : '')));
      dl.append(el('dd', '', p.znaczenie));
    }
    d.append(dl);
    m.append(d);
  }

  if (t.pytania.length) {
    const b = el('button', 'glowny', `Sprawdź się — ${t.pytania.length} pytań`);
    b.onclick = () => startQuiz(t.pytania, t.nazwa);
    m.append(b);
  }
  const w = el('button', 'drugi', '← Wróć do listy');
  w.onclick = () => { widok = { nazwa: 'tomy' }; rysuj() };
  m.append(w);
  window.scrollTo(0, 0);
}

/* ── quiz ─────────────────────────────────────────────────────────────── */
function startQuiz(pytania, tytul) {
  widok = { nazwa: 'quiz', tytul, quiz: { pytania: przetasuj(pytania).map(ulozPytanie), i: 0, dobre: 0, ble: [] } };
  rysuj();
}

function ekranQuiz() {
  const q = widok.quiz;
  ustawPasek(widok.tytul, true);
  const m = $('#ekran'); m.innerHTML = '';
  if (q.i >= q.pytania.length) return ekranWynik();

  const p = q.pytania[q.i];
  const k = el('div', 'karta');
  k.append(el('div', 'pyt-licznik', `Pytanie ${q.i + 1} z ${q.pytania.length}${p.ccp ? ' · punkt krytyczny' : ''}`));
  k.append(el('h2', '', p.pytanie));
  if (p.typ === 'wielokrotny') k.append(el('p', 'cichy mini', 'Można zaznaczyć więcej niż jedną odpowiedź.'));

  const wybrane = new Set();
  const przyciski = [];
  const box = el('div');
  p.opcje.forEach((tekst, i) => {
    const b = el('button', 'opcja', tekst);
    b.onclick = () => {
      if (p.typ === 'wielokrotny') { wybrane.has(i) ? wybrane.delete(i) : wybrane.add(i); b.classList.toggle('wybrana') }
      else { wybrane.clear(); wybrane.add(i); przyciski.forEach((x) => x.classList.remove('wybrana')); b.classList.add('wybrana') }
      zatwierdz.disabled = wybrane.size === 0;
    };
    przyciski.push(b); box.append(b);
  });
  k.append(box);

  const zatwierdz = el('button', 'glowny', 'Sprawdź odpowiedź');
  zatwierdz.disabled = true;
  zatwierdz.onclick = () => {
    const wybor = [...wybrane].sort((a, b) => a - b);
    const dobrze = wybor.length === p.poprawne.length && wybor.every((x, idx) => x === p.poprawne[idx]);
    przyciski.forEach((b, i) => {
      b.disabled = true;
      if (p.poprawne.includes(i)) b.classList.add('ok');
      else if (wybrane.has(i)) b.classList.add('zle');
      b.classList.remove('wybrana');
    });
    zapiszOdpowiedz(p.id, dobrze);
    if (dobrze) q.dobre++; else q.ble.push(p);
    zatwierdz.remove();

    const w = el('div', 'wyjasnienie');
    w.append(el('h4', '', dobrze ? '✅ Dobrze' : '❌ Nie tym razem'));
    if (p.wyjasnienie) w.append(el('p', '', p.wyjasnienie));
    if (p.zrodlo) w.append(el('div', 'zrodlo', 'Źródło: ' + p.zrodlo));
    k.append(w);

    const dalej = el('button', 'glowny', q.i + 1 < q.pytania.length ? 'Następne pytanie →' : 'Zobacz wynik');
    dalej.onclick = () => { q.i++; rysuj() };
    k.append(dalej);
    dalej.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  k.append(zatwierdz);
  m.append(k);
  window.scrollTo(0, 0);
}

function ekranWynik() {
  const q = widok.quiz;
  const m = $('#ekran'); m.innerHTML = '';
  const proc = q.pytania.length ? q.dobre / q.pytania.length : 0;
  const k = el('div', 'karta');
  k.append(el('h2', '', proc >= PROG ? '🎉 Zaliczone' : 'Jeszcze nie ten poziom'));
  k.append(el('div', 'postep-liczba', `${q.dobre}/${q.pytania.length}`));
  k.append(el('p', 'cichy', proc >= PROG
    ? 'Dobra robota. Wróć tu za jakiś czas — powtórka po kilku dniach utrwala najmocniej.'
    : 'To normalne. Wróć do materiału, przeczytaj bloki „Jak to działa” i spróbuj ponownie.'));
  const ccpZle = q.ble.filter((p) => p.ccp);
  if (ccpZle.length) {
    const u = el('p', 'plakietka ccp', `Uwaga: ${ccpZle.length} niezaliczonych pytań o bezpieczeństwo — te wymagają 100%.`);
    k.append(u);
  }
  m.append(k);
  if (q.ble.length) {
    const b = el('button', 'glowny', `Popraw ${q.ble.length} błędnych`);
    b.onclick = () => startQuiz(q.ble, widok.tytul);
    m.append(b);
  }
  const w = el('button', 'drugi', 'Wróć do listy tomów');
  w.onclick = () => { widok = { nazwa: 'tomy' }; rysuj() };
  m.append(w);
  window.scrollTo(0, 0);
}

/* ── powtórka: wszystkie błędne z historii ────────────────────────────── */
function ekranPowtorka() {
  ustawPasek('Powtórka', false);
  const m = $('#ekran'); m.innerHTML = '';
  const p = postep();
  const ble = DANE.tomy.flatMap((t) => t.pytania).filter((x) => p[x.id] === false);
  const nowe = DANE.tomy.flatMap((t) => t.pytania).filter((x) => p[x.id] === undefined);
  const k = el('div', 'karta');
  k.append(el('h2', '', 'Powtórka'));
  k.append(el('p', 'cichy', ble.length
    ? `Masz ${ble.length} pytań, w których się pomyliłeś. To najlepszy materiał do powtórki — pamięć utrwala się na błędach.`
    : 'Brak błędnych odpowiedzi do powtórzenia. Możesz przećwiczyć pytania, których jeszcze nie widziałeś.'));
  m.append(k);
  if (ble.length) { const b = el('button', 'glowny', `Powtórz ${ble.length} błędnych`); b.onclick = () => startQuiz(ble, 'Powtórka'); m.append(b) }
  if (nowe.length) { const b = el('button', 'drugi', `Losowe 10 z nieprzerobionych (${nowe.length})`); b.onclick = () => startQuiz(przetasuj(nowe).slice(0, 10), 'Nowe pytania'); m.append(b) }
}

/* ── postęp ───────────────────────────────────────────────────────────── */
function ekranPostep() {
  ustawPasek('Twój postęp', false);
  const m = $('#ekran'); m.innerHTML = '';
  const p = postep();
  const wszystkie = DANE.tomy.flatMap((t) => t.pytania);
  const zwykle = wszystkie.filter((x) => !x.ccp);
  const ccp = wszystkie.filter((x) => x.ccp);
  const ok = zwykle.filter((x) => p[x.id] === true).length;
  const ccpOk = ccp.filter((x) => p[x.id] === true).length;

  const k = el('div', 'karta');
  k.append(el('h2', '', 'Razem'));
  k.append(el('div', 'postep-liczba', `${Math.round((ok / (zwykle.length || 1)) * 100)}%`));
  k.append(el('p', 'cichy', `${ok} z ${zwykle.length} pytań zaliczonych`));
  const pasek = el('div', 'pasek'); const i = el('i'); i.style.width = Math.round((ok / (zwykle.length || 1)) * 100) + '%'; pasek.append(i); k.append(pasek);
  m.append(k);

  const kc = el('div', 'karta');
  kc.append(el('h3', '', 'Bezpieczeństwo żywności (CCP)'));
  kc.append(el('p', '', `${ccpOk} z ${ccp.length} zaliczonych`));
  kc.append(el('p', 'cichy mini', 'Pytania oznaczone jako krytyczne wymagają 100% — bez nich tom nie jest opanowany.'));
  m.append(kc);

  const lista = el('div', 'karta');
  lista.append(el('h3', '', 'Tomy'));
  for (const t of DANE.tomy) {
    const s = policzTom(t, p);
    const r = el('div', 'cichy mini');
    r.textContent = `${s.stan === 'ok' ? '✅' : s.stan === 'toku' ? '🔸' : '⬜'} ${t.nazwa} — ${s.ok}/${s.zwykle}`;
    lista.append(r);
  }
  m.append(lista);

  const reset = el('button', 'drugi', 'Wyczyść mój postęp');
  reset.onclick = () => { if (confirm('Skasować cały zapisany postęp na tym urządzeniu?')) { localStorage.removeItem(klucz(KLUCZ_POSTEP)); rysuj() } };
  m.append(reset);
  const info = el('p', 'cichy mini', 'Postęp zapisuje się wyłącznie w tej przeglądarce. Nikt go nie widzi i nie jest nigdzie wysyłany.');
  m.append(info);
}

/* ── szukajka ─────────────────────────────────────────────────────────── */
function ekranSzukaj() {
  ustawPasek('Szukaj', true);
  const m = $('#ekran'); m.innerHTML = '';
  const input = el('input', 'szukajka');
  input.type = 'search'; input.placeholder = 'np. zakwas, garowanie, alergen…';
  m.append(input);
  const wyniki = el('div'); m.append(wyniki);

  const szukaj = () => {
    const q = norm(input.value.trim());
    wyniki.innerHTML = '';
    if (q.length < 2) { wyniki.append(el('p', 'cichy', 'Wpisz co najmniej dwa znaki.')); return }
    let n = 0;
    for (const t of DANE.tomy) {
      const trafienia = [];
      if (norm(t.nazwa).includes(q) || norm(t.intro).includes(q)) trafienia.push(t.intro || t.nazwa);
      t.karty.forEach((k) => {
        if (norm(k.tytul).includes(q)) trafienia.push(k.tytul);
        (k.punkty || []).forEach((p) => { if (norm(p).includes(q)) trafienia.push(p) });
        if (k.mechanizm && norm(k.mechanizm).includes(q)) trafienia.push(k.mechanizm.slice(0, 160) + '…');
      });
      t.pojecia.forEach((p) => { if (norm(p.termin).includes(q)) trafienia.push(`${p.termin} — ${p.znaczenie.slice(0, 140)}…`) });
      if (!trafienia.length) continue;
      n++;
      const k = el('div', 'karta');
      k.append(el('h3', '', t.nazwa));
      trafienia.slice(0, 3).forEach((x) => k.append(el('p', 'mini', x)));
      const b = el('button', 'drugi', 'Otwórz materiał →');
      b.onclick = () => { widok = { nazwa: 'tom', tom: t }; rysuj() };
      k.append(b);
      wyniki.append(k);
    }
    if (!n) wyniki.append(el('p', 'cichy', 'Nic nie znalazłem. Spróbuj innego słowa.'));
  };
  input.oninput = szukaj;
  input.focus();
}

/* ── router ───────────────────────────────────────────────────────────── */
function rysuj() {
  const w = widok.nazwa;
  if (w === 'tomy') ekranTomy();
  else if (w === 'tom') ekranTom();
  else if (w === 'quiz') ekranQuiz();
  else if (w === 'powtorka') ekranPowtorka();
  else if (w === 'postep') ekranPostep();
  else if (w === 'szukaj') ekranSzukaj();
  document.querySelectorAll('#nawigacja button').forEach((b) => b.classList.toggle('akt', b.dataset.widok === w));
}

function podepnij() {
  $('#wstecz').onclick = () => { widok = { nazwa: 'tomy' }; rysuj() };
  $('#szukajBtn').onclick = () => { widok = { nazwa: 'szukaj' }; rysuj() };
  document.querySelectorAll('#nawigacja button').forEach((b) => {
    b.onclick = () => { widok = { nazwa: b.dataset.widok }; rysuj() };
  });
}

async function start() {
  try {
    DANE = JSON.parse(document.getElementById('dane-kursu').textContent);
  } catch (e) {
    $('#ekran').innerHTML = '';
    const k = el('div', 'karta');
    k.append(el('h2', '', 'Nie udało się wczytać materiałów'));
    k.append(el('p', 'cichy', 'Sprawdź połączenie i odśwież stronę. Jeśli otwierasz plik lokalnie (file://), uruchom prosty serwer HTTP — przeglądarka blokuje wczytywanie danych z dysku.'));
    $('#ekran').append(k);
    return;
  }
  $('#nawigacja').hidden = false;
  podepnij();
  rysuj();
  }

if (typeof document !== 'undefined') start();

</script>
