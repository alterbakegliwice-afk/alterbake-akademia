<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8a4b2a">
<title>Akademia Alterbake</title>

<style>
:root{
  --tlo:#faf7f4; --karta:#fff; --tekst:#231c17; --cichy:#6b5f56;
  --akcent:#8a4b2a; --akcent-jasny:#f3e6dd; --ok:#2f7a4d; --zle:#b3352b;
  --ramka:#e6dcd3; --cien:0 1px 3px rgba(35,28,23,.08);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--tlo:#1a1512;--karta:#241d18;--tekst:#f0e8e2;--cichy:#b3a396;
        --akcent:#e0a077;--akcent-jasny:#3a2a20;--ramka:#3a2f27;--cien:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--tlo);color:var(--tekst);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#pasek{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--akcent);color:#fff}
#pasek h1{flex:1;font-size:17px;margin:0;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ikona{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;
  min-width:40px;min-height:40px;font-size:18px;cursor:pointer}
main{padding:14px;max-width:760px;margin:0 auto}
.karta{background:var(--karta);border:1px solid var(--ramka);border-radius:var(--r);
  padding:16px;margin-bottom:12px;box-shadow:var(--cien)}
.karta h2{margin:0 0 6px;font-size:18px}
.karta h3{margin:0 0 10px;font-size:16px;color:var(--akcent)}
.cichy{color:var(--cichy);font-size:14px}
.mini{font-size:13px}
ul.punkty{margin:0;padding-left:20px}
ul.punkty li{margin-bottom:8px}
.mechanizm{margin-top:12px;padding:12px;background:var(--akcent-jasny);border-radius:10px}
.mechanizm h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--akcent)}
.mechanizm p{margin:0;font-size:15px}
.zrodlo{margin-top:10px;font-size:12px;color:var(--cichy);word-break:break-word}
button.glowny{width:100%;min-height:52px;background:var(--akcent);color:#fff;border:0;
  border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
button.drugi{width:100%;min-height:48px;background:transparent;color:var(--akcent);
  border:1.5px solid var(--akcent);border-radius:12px;font-size:15px;cursor:pointer;margin-top:8px}
.lista-tomow{display:grid;gap:10px}
.tom{display:block;width:100%;text-align:left;background:var(--karta);border:1px solid var(--ramka);
  border-radius:var(--r);padding:14px;cursor:pointer;color:inherit;font:inherit}
.tom .naglowek{display:flex;align-items:center;gap:8px;font-weight:600}
.tom .naglowek span.stan{margin-left:auto;font-size:13px;color:var(--cichy);white-space:nowrap}
.pasek{height:6px;background:var(--ramka);border-radius:3px;margin-top:10px;overflow:hidden}
.pasek i{display:block;height:100%;background:var(--ok);border-radius:3px}
.plakietka{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
  background:var(--akcent-jasny);color:var(--akcent);font-weight:600}
.plakietka.ccp{background:#fdeceb;color:var(--zle)}
@media (prefers-color-scheme:dark){.plakietka.ccp{background:#3a201e;color:#f0a29b}}
.sciezki{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.sciezki button{white-space:nowrap;min-height:44px;padding:10px 16px;border-radius:22px;
  border:1.5px solid var(--ramka);background:var(--karta);color:var(--tekst);font-size:14px;cursor:pointer}
.sciezki button.akt{background:var(--akcent);color:#fff;border-color:var(--akcent)}
.opcja{display:block;width:100%;text-align:left;background:var(--karta);border:1.5px solid var(--ramka);
  border-radius:12px;padding:14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer;min-height:52px}
.opcja.wybrana{border-color:var(--akcent);background:var(--akcent-jasny)}
.opcja.ok{border-color:var(--ok);background:rgba(47,122,77,.12)}
.opcja.zle{border-color:var(--zle);background:rgba(179,53,43,.10)}
.opcja:disabled{cursor:default;opacity:1}
.wyjasnienie{margin-top:10px;padding:14px;border-radius:12px;background:var(--akcent-jasny)}
.wyjasnienie h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;color:var(--akcent)}
.wyjasnienie p{margin:0 0 8px;font-size:15px}
#nawigacja{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--karta);
  border-top:1px solid var(--ramka);padding-bottom:env(safe-area-inset-bottom);z-index:10}
#nawigacja button{flex:1;min-height:60px;background:none;border:0;color:var(--cichy);
  font-size:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
#nawigacja button.akt{color:var(--akcent);font-weight:600}
details.slownik{margin-top:12px}
details.slownik summary{cursor:pointer;font-weight:600;padding:12px;background:var(--karta);
  border:1px solid var(--ramka);border-radius:12px;min-height:44px;display:flex;align-items:center}
details.slownik dl{margin:10px 0 0}
details.slownik dt{font-weight:600;margin-top:12px}
details.slownik dd{margin:2px 0 0;font-size:14px;color:var(--cichy)}
input.szukajka{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--ramka);
  border-radius:12px;font-size:16px;background:var(--karta);color:var(--tekst);margin-bottom:12px}
.postep-liczba{font-size:34px;font-weight:700;color:var(--akcent);line-height:1}
.ladowanie{text-align:center;color:var(--cichy);padding:40px 0}
.pyt-licznik{font-size:13px;color:var(--cichy);margin-bottom:6px}
mark{background:var(--akcent-jasny);color:inherit;padding:0 2px;border-radius:3px}

.nota-tytul{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--akcent)}

   Moduł to już nie fiszka, tylko rozdział: wykład ciągły, wyróżnione zdania
   z hali, tabela parametrów, procedura, diagnostyka, ćwiczenie i checklista.
   Style trzymają się palety wyżej — żadnego nowego koloru, bo ekran ma
   pozostać jednym dokumentem, a nie zbiorem doklejonych ramek. */
.nauka-cele{margin:0;padding-left:20px}
.nauka-cele li{margin-bottom:6px;font-size:15px}
.nauka-numer{font-size:12px;color:var(--cichy);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.nauka-tresc{margin:0 0 12px;font-size:16px;line-height:1.62}
.nauka-tresc:last-of-type{margin-bottom:14px}
.nauka-param{background:var(--akcent-jasny);color:var(--akcent);border-radius:5px;
  padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.nauka-wyrozniony{margin:12px 0;padding:12px 14px;border-radius:10px;border-left:4px solid var(--akcent)}
.nauka-zhali{background:var(--akcent-jasny)}
.nauka-zapamietaj{background:var(--akcent-jasny);border-left-style:double;border-left-width:6px}
.nauka-wyrozniony .etykieta{display:block;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--akcent);font-weight:700;margin-bottom:4px}
.nauka-wyrozniony p{margin:0;font-size:15px}
.punkt-lead{font-weight:600}
.nauka-sekcja{margin:0 0 10px;font-size:13px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--akcent)}
.wyczucie-poz{padding:10px 0;border-top:1px solid var(--ramka)}
.wyczucie-poz:first-of-type{border-top:0;padding-top:0}
.wyczucie-zmysl{font-weight:600;font-size:14px}
.wyczucie-opis{margin:2px 0 0;font-size:15px}
.wyczucie-porownanie{margin:4px 0 0;font-size:13px;color:var(--cichy);font-style:italic}
.parametry-poz{padding:10px 0;border-top:1px solid var(--ramka)}
.parametry-poz:first-of-type{border-top:0;padding-top:0}
.parametry-nazwa{font-weight:600;font-size:14px}
.parametry-wartosc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;color:var(--akcent);margin:2px 0 0}
.parametry-uwaga{margin:4px 0 0;font-size:13px;color:var(--cichy)}
.nauka-kalibracja{margin-top:10px;font-size:13px;color:var(--cichy)}
.procedura-lista{margin:0;padding-left:20px}
.procedura-poz{margin-bottom:12px}
.procedura-krok{font-weight:600}
.procedura-opis{margin:2px 0 0;font-size:15px}
.procedura-uwaga{margin:4px 0 0;font-size:13px;color:var(--cichy)}
.bledy-poz{padding:10px 0;border-top:1px solid var(--ramka)}
.bledy-poz:first-of-type{border-top:0;padding-top:0}
.bledy-objaw{font-weight:600;font-size:15px}
.bledy-wiersz{margin:3px 0 0;font-size:14px}
.bledy-etykieta{color:var(--cichy);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.checklista-lista{list-style:none;margin:0;padding:0}
.checklista-lista li{padding:7px 0 7px 26px;position:relative;font-size:15px;
  border-top:1px solid var(--ramka)}
.checklista-lista li:first-child{border-top:0}
.checklista-lista li::before{content:"☐";position:absolute;left:0;top:6px;color:var(--akcent);font-size:17px}
.powiazania-lista{display:flex;flex-wrap:wrap;gap:8px}
.powiazanie-chip{min-height:40px;padding:8px 14px;border-radius:20px;border:1.5px solid var(--ramka);
  background:var(--karta);color:var(--akcent);font:inherit;font-size:14px;cursor:pointer}

</style>

/* ── logika postępu ────────────────────────────────────────────────────────
   Ta sama reguła co w Panelu: procent liczą WYŁĄCZNIE pytania zwykłe,

function policzTom(tom, p) {
  const zwykle = tom.pytania.filter((x) => !x.ccp);
  const ccp = tom.pytania.filter((x) => x.ccp);
  const ok = zwykle.filter((x) => p[x.id] === true).length;
  const ccpOk = ccp.every((x) => p[x.id] === true);
  const procent = zwykle.length ? ok / zwykle.length : (ccpOk ? 1 : 0);
  return {
    ok, zwykle: zwykle.length, ccpPytan: ccp.length, ccpOk, procent,
    stan: !ccpOk ? 'blok' : procent >= PROG ? 'ok' : ok > 0 ? 'toku' : 'start'
  };
}

/* Losowa kolejność — pytań i opcji. Bez tego uczy się pozycji odpowiedzi,
   a nie treści (redteam U-01). */
function przetasuj(t) {
  const a = [...t];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] }
  return a;
}
function ulozPytanie(p) {
  const idx = przetasuj(p.opcje.map((_, i) => i));
  return { ...p, opcje: idx.map((i) => p.opcje[i]), poprawne: p.poprawne.map((i) => idx.indexOf(i)).sort((a, b) => a - b) };
}

   sprawdza, że obie implementacje dzielą punkty i formatują tekst tak samo.
   Zmieniasz jedną — zmieniasz drugą, inaczej test się zapali.

   Wyróżniki są DANYMI, nie dekoracją: autor pisze je jako zwykły punkt listy,
   ekran wyciąga je na osobne bloki. Zostawione w liście tonęłyby między
   faktami, a to jedyne dwa zdania rozdziału, które mają zostać w głowie. */
const ZNACZNIK_HALA = '🔎 Z hali:';
const ZNACZNIK_ZAPAMIETAJ = '🧠 Zapamiętaj:';
const MAX_LEAD = 44;

function rozdzielPunkty(punkty) {
  const zwykle = []; let zHali = null, zapamietaj = null;
  for (const x of punkty || []) {
    const t = String(x || '').trim();
    if (t.startsWith(ZNACZNIK_HALA)) {
      const tresc = t.slice(ZNACZNIK_HALA.length).trim();
      if (zHali === null) zHali = tresc; else zwykle.push(t);
    } else if (t.startsWith(ZNACZNIK_ZAPAMIETAJ)) {
      const tresc = t.slice(ZNACZNIK_ZAPAMIETAJ.length).trim();
      if (zapamietaj === null) zapamietaj = tresc; else zwykle.push(t);
    } else if (t) zwykle.push(t);
  }
  return { punkty: zwykle, zHali, zapamietaj };
}

/* „Nazwa: treść" → lead do pogrubienia. Warunki ostre celowo: dwukropek blisko
   początku, bez kropki przed nim (inaczej pogrubia się pół zdania) i bez
   formatowania w środku (gwiazdki wyszłyby na ekran jako surowy tekst). */
function leadPunktu(tekst) {
  const t = String(tekst || '');
  const i = t.indexOf(':');
  if (i < 2 || i > MAX_LEAD) return { lead: null, reszta: t };
  const lead = t.slice(0, i);
  if (/[.;!?]/.test(lead) || /[*`]/.test(lead)) return { lead: null, reszta: t };
  const reszta = t.slice(i + 1).trim();
  if (!reszta) return { lead: null, reszta: t };
  return { lead, reszta };
}

/* Kolejność w wyrażeniu ma znaczenie: `**` przed `*`, inaczej „**mocne**"
   rozpada się na dwie puste kursywy. */
const WZORZEC_INLINE = /(\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`\n]+`)/g;

function formatujInline(tekst) {
  const t = String(tekst == null ? '' : tekst);
  if (!t) return [];
  const tokeny = []; let ostatni = 0;
  for (const dop of t.matchAll(WZORZEC_INLINE)) {
    if (dop.index > ostatni) tokeny.push({ typ: 'zwykly', tekst: t.slice(ostatni, dop.index) });
    const x = dop[0];
    if (x.startsWith('**')) tokeny.push({ typ: 'mocny', tekst: x.slice(2, -2) });
    else if (x.startsWith('`')) tokeny.push({ typ: 'kod', tekst: x.slice(1, -1) });
    else tokeny.push({ typ: 'kursywa', tekst: x.slice(1, -1) });
    ostatni = dop.index + x.length;
  }
  if (ostatni < t.length) tokeny.push({ typ: 'zwykly', tekst: t.slice(ostatni) });
  return tokeny;
}

/* Tekst bez składni — do szukajki. Gwiazdki nie mogą decydować o trafieniu. */
function bezZnacznikow(tekst) {
  return formatujInline(tekst).map((t) => t.tekst).join('');
}

/* ── pomocnicze DOM ────────────────────────────────────────────────────── */
const $ = (s) => document.querySelector(s);
const el = (tag, kl, txt) => { const e = document.createElement(tag); if (kl) e.className = kl; if (txt != null) e.textContent = txt; return e };

/* Tekst z formatowaniem inline wstawiony do elementu. Budujemy WĘZŁY, nie
   innerHTML: materiał jest danymi, a dane nigdy nie wchodzą do dokumentu
   jako HTML — nawet własne. */
function wstawTekst(rodzic, tekst) {
  for (const t of formatujInline(tekst)) {
    if (t.typ === 'mocny') rodzic.append(el('strong', '', t.tekst));
    else if (t.typ === 'kursywa') rodzic.append(el('em', '', t.tekst));
    else if (t.typ === 'kod') rodzic.append(el('code', 'nauka-param', t.tekst));
    else rodzic.append(document.createTextNode(t.tekst));
  }
  return rodzic;
}
const akapit = (kl, tekst) => wstawTekst(el('p', kl), tekst);

/* Sekcja po rozdziałach — rysowana TYLKO gdy ma zawartość. Pusta sekcja
   z samym nagłówkiem uczy przewijania, nie rzemiosła; moduł nieprzepisany
   ma wyglądać jak przedtem, a nie jak zepsuty. */
function sekcja(rodzic, tytul, pozycje, rysuj) {
  if (!pozycje || !pozycje.length) return null;
  const k = el('div', 'karta');
  k.append(el('h3', 'nauka-sekcja', tytul));
  rysuj(k);
  rodzic.append(k);
  return k;
}

function wyrozniony(rodzic, klasa, etykieta, tekst) {
  if (!tekst) return;
  const d = el('div', 'nauka-wyrozniony ' + klasa);
  d.append(el('span', 'etykieta', etykieta));
  d.append(akapit('', tekst));
  rodzic.append(d);
}
const norm = (t) => String(t || '').toLowerCase().replace(/[ąćęłńóśźż]/g, (z) => 'acelnoszz'['ąćęłńóśźż'.indexOf(z)]);

function ustawPasek(tytul, zWstecz) {
  $('#tytul').textContent = tytul;
  $('#wstecz').hidden = !zWstecz;
}

/* ── ekran: materiał tomu ─────────────────────────────────────────────────
   Od 29.08.2026 moduł jest ROZDZIAŁEM, nie fiszką: wykład ciągły, wyróżnione
   zdanie z hali, tabela parametrów, procedura, diagnostyka, ćwiczenie
   i checklista. Kolejność w rozdziale jest stała i celowa —
   tresc → punkty → 🔎 Z hali → mechanizm → 🧠 Zapamiętaj → źródło —
   bo czytelnik ma najpierw ZROZUMIEĆ, potem zobaczyć to w praktyce,
   dopiero na końcu dostać zdanie do zapamiętania.

   KAŻDA sekcja jest opcjonalna i pusta nie rysuje się wcale. Moduł
   nieprzepisany na nowy standard wygląda dokładnie tak, jak wyglądał. */
function ekranTom() {
  const t = widok.tom;
  ustawPasek(t.nazwa, true);
  const m = $('#ekran'); m.innerHTML = '';

  if (t.intro || (t.cele && t.cele.length)) {
    const k = el('div', 'karta');
    k.append(el('span', 'plakietka', 'Materiał do nauki'));
    k.append(el('h2', '', t.nazwa));
    if (t.intro) k.append(akapit('', t.intro));
    if (t.cele && t.cele.length) {
      k.append(el('h3', 'nauka-sekcja', 'Po tym module potrafisz'));
      const ul = el('ul', 'nauka-cele');
      t.cele.forEach((c) => ul.append(wstawTekst(el('li'), c)));
      k.append(ul);
    }
    m.append(k);
  }

  (t.karty || []).forEach((karta, i) => {
    const k = el('div', 'karta');
    if ((t.karty || []).length > 1) k.append(el('div', 'nauka-numer', `Rozdział ${i + 1} z ${t.karty.length}`));
    k.append(el('h3', '', karta.tytul));

    (karta.tresc || []).forEach((akap) => k.append(akapit('nauka-tresc', akap)));

    const { punkty, zHali, zapamietaj } = rozdzielPunkty(karta.punkty);
    if (punkty.length) {
      const ul = el('ul', 'punkty');
      punkty.forEach((x) => {
        const li = el('li');
        const { lead, reszta } = leadPunktu(x);
        if (lead) { li.append(el('span', 'punkt-lead', lead + ': ')); wstawTekst(li, reszta) }
        else wstawTekst(li, x);
        ul.append(li);
      });
      k.append(ul);
    }

    wyrozniony(k, 'nauka-zhali', '🔎 Z hali', zHali);

    if (karta.mechanizm) {
      const mech = el('div', 'mechanizm');
      mech.append(el('h4', '', 'Jak to działa'));
      mech.append(akapit('', karta.mechanizm));
      k.append(mech);
    }

    wyrozniony(k, 'nauka-zapamietaj', '🧠 Zapamiętaj', zapamietaj);

    if (karta.zrodlo) k.append(el('div', 'zrodlo', 'Źródło: ' + karta.zrodlo));
    m.append(k);
  });

  /* Wyczucie zmysłowe: to jedyna sekcja, której nie da się zastąpić liczbą.
     Termometr mówi, ile jest stopni; nos mówi, czy zakwas jest zdrowy. */
  sekcja(m, 'Czego szukać zmysłami', t.wyczucie, (k) => {
    t.wyczucie.forEach((w) => {
      const d = el('div', 'wyczucie-poz');
      d.append(el('div', 'wyczucie-zmysl', w.zmysl));
      d.append(akapit('wyczucie-opis', w.opis));
      if (w.porownanie) d.append(el('p', 'wyczucie-porownanie', w.porownanie));
      k.append(d);
    });
  });

  sekcja(m, 'Parametry', t.parametry, (k) => {
    t.parametry.forEach((par) => {
      const d = el('div', 'parametry-poz');
      d.append(el('div', 'parametry-nazwa', par.nazwa));
      d.append(el('p', 'parametry-wartosc', par.wartosc));
      if (par.uwaga) d.append(akapit('parametry-uwaga', par.uwaga));
      k.append(d);
    });
    /* Nota kalibracyjna stoi PRZY liczbach, nie na końcu ekranu. Zdanie
       o kalibracji trzy sekcje niżej przeczyta ktoś, kto już zdążył
       potraktować zakres z tabeli jak wyrok. */
    k.append(el('p', 'nauka-kalibracja', 'Wszystkie wartości są punktem startu do kalibracji na Twoim sprzęcie i surowcu — nie stałymi fizycznymi. Gdy ciasto zachowuje się inaczej, zapisz odchylenie i zgłoś je liderowi zmiany.'));
  });

  sekcja(m, 'Jak to zrobić', t.procedura, (k) => {
    const ol = el('ol', 'procedura-lista');
    t.procedura.forEach((krok) => {
      const li = el('li', 'procedura-poz');
      li.append(el('div', 'procedura-krok', krok.krok));
      if (krok.opis) li.append(akapit('procedura-opis', krok.opis));
      if (krok.uwaga) li.append(akapit('procedura-uwaga', krok.uwaga));
      ol.append(li);
    });
    k.append(ol);
  });

  sekcja(m, 'Gdy coś poszło nie tak', t.bledy, (k) => {
    t.bledy.forEach((b) => {
      const d = el('div', 'bledy-poz');
      d.append(el('div', 'bledy-objaw', b.objaw));
      const przyczyna = el('p', 'bledy-wiersz');
      przyczyna.append(el('span', 'bledy-etykieta', 'Przyczyna: '));
      wstawTekst(przyczyna, b.przyczyna);
      d.append(przyczyna);
      const korekta = el('p', 'bledy-wiersz');
      korekta.append(el('span', 'bledy-etykieta', 'Korekta: '));
      wstawTekst(korekta, b.korekta);
      d.append(korekta);
      k.append(d);
    });
  });

  if (t.cwiczenie && t.cwiczenie.kroki && t.cwiczenie.kroki.length) {
    const k = el('div', 'karta');
    k.append(el('h3', 'nauka-sekcja', 'Ćwiczenie'));
    if (t.cwiczenie.tytul) k.append(el('h3', '', t.cwiczenie.tytul));
    const ol = el('ol', 'procedura-lista');
    t.cwiczenie.kroki.forEach((x) => ol.append(wstawTekst(el('li', 'procedura-poz'), x)));
    k.append(ol);
    if (t.cwiczenie.kryterium) {
      const d = el('div', 'nauka-wyrozniony nauka-zapamietaj');
      d.append(el('span', 'etykieta', 'Zrobione, gdy'));
      d.append(akapit('', t.cwiczenie.kryterium));
      k.append(d);
    }
    m.append(k);
  }

  sekcja(m, 'Zanim uznasz, że gotowe', t.checklista, (k) => {
    const ul = el('ul', 'checklista-lista');
    t.checklista.forEach((x) => ul.append(wstawTekst(el('li'), x)));
    k.append(ul);
  });

  /* Powiązania są PRZYCISKAMI, nie listą nazw. Odesłanie, którego nie da się
     kliknąć, jest w kursie na telefonie odesłaniem donikąd. Moduł spoza tej
     wersji (np. wewnętrzny) po prostu się nie rysuje — zamiast prowadzić
     w pustkę. */
  if (t.powiazania && t.powiazania.length) {
    const dostepne = t.powiazania.filter((n) => DANE.tomy.some((x) => x.nazwa === n));
    if (dostepne.length) {
      const k = el('div', 'karta');
      k.append(el('h3', 'nauka-sekcja', 'Powiązane moduły'));
      const box = el('div', 'powiazania-lista');
      dostepne.forEach((n) => {
        const b = el('button', 'powiazanie-chip', n);
        b.onclick = () => { widok = { nazwa: 'tom', tom: DANE.tomy.find((x) => x.nazwa === n) }; rysuj() };
        box.append(b);
      });
      k.append(box);
      m.append(k);
    }
  }

  if (t.pojecia && t.pojecia.length) {
    const d = el('details', 'slownik');
    d.append(el('summary', '', `📖 Słownik — ${t.pojecia.length} pojęć z tego materiału`));
    const dl = el('dl');
    for (const p of t.pojecia) {
      dl.append(el('dt', '', p.termin + (p.rozwiniecie ? ` — ${p.rozwiniecie}` : '')));
      dl.append(el('dd', '', p.znaczenie));
    }
    d.append(dl);
    m.append(d);
  }

  /* Nota kalibracyjna dla modułów BEZ tabeli parametrów — tam liczby siedzą
     w treści rozdziałów i nikt ich nie opatrzył ostrzeżeniem. Moduł z tabelą
     ma tę notę wyżej, przy liczbach, więc drugi raz jej nie powtarzamy. */
  if (!t.parametry || !t.parametry.length) {
    const nota = el('div', 'karta');
    nota.append(el('h4', 'nota-tytul', 'Zanim zastosujesz liczby'));
    nota.append(el('p', 'mini', 'Wszystkie parametry (temperatury, czasy, procenty) to wartości startowe do kalibracji na naszym sprzęcie i surowcu — nie stałe. Gdy Twoje ciasto zachowuje się inaczej, zapisz odchylenie w dzienniku i zgłoś je liderowi zmiany.'));
    m.append(nota);
  }

  if (t.pytania.length) {
    const b = el('button', 'glowny', `Sprawdź się — ${t.pytania.length} pytań`);
    b.onclick = () => startQuiz(t.pytania, t.nazwa);
    m.append(b);
  }
  const w = el('button', 'drugi', '← Wróć do listy');
  w.onclick = () => { widok = { nazwa: 'tomy' }; rysuj() };
  m.append(w);
  window.scrollTo(0, 0);
}

/* ── quiz ─────────────────────────────────────────────────────────────── */
function startQuiz(pytania, tytul) {
  widok = { nazwa: 'quiz', tytul, quiz: { pytania: przetasuj(pytania).map(ulozPytanie), i: 0, dobre: 0, ble: [] } };
  rysuj();
}

function ekranQuiz() {
  const q = widok.quiz;
  ustawPasek(widok.tytul, true);
  const m = $('#ekran'); m.innerHTML = '';
  if (q.i >= q.pytania.length) return ekranWynik();

  const p = q.pytania[q.i];
  const k = el('div', 'karta');
  k.append(el('div', 'pyt-licznik', `Pytanie ${q.i + 1} z ${q.pytania.length}${p.ccp ? ' · punkt krytyczny' : ''}`));
  k.append(el('h2', '', p.pytanie));
  if (p.typ === 'wielokrotny') k.append(el('p', 'cichy mini', 'Można zaznaczyć więcej niż jedną odpowiedź.'));

  const wybrane = new Set();
  const przyciski = [];
  const box = el('div');
  p.opcje.forEach((tekst, i) => {
    const b = el('button', 'opcja', tekst);
    b.onclick = () => {
      if (p.typ === 'wielokrotny') { wybrane.has(i) ? wybrane.delete(i) : wybrane.add(i); b.classList.toggle('wybrana') }
      else { wybrane.clear(); wybrane.add(i); przyciski.forEach((x) => x.classList.remove('wybrana')); b.classList.add('wybrana') }
      zatwierdz.disabled = wybrane.size === 0;
    };
    przyciski.push(b); box.append(b);
  });
  k.append(box);

  const zatwierdz = el('button', 'glowny', 'Sprawdź odpowiedź');
  zatwierdz.disabled = true;
  zatwierdz.onclick = () => {
    const wybor = [...wybrane].sort((a, b) => a - b);
    const dobrze = wybor.length === p.poprawne.length && wybor.every((x, idx) => x === p.poprawne[idx]);
    przyciski.forEach((b, i) => {
      b.disabled = true;
      if (p.poprawne.includes(i)) b.classList.add('ok');
      else if (wybrane.has(i)) b.classList.add('zle');
      b.classList.remove('wybrana');
    });
    zapiszOdpowiedz(p.id, dobrze);
    if (dobrze) q.dobre++; else q.ble.push(p);
    zatwierdz.remove();

    const w = el('div', 'wyjasnienie');
    w.append(el('h4', '', dobrze ? '✅ Dobrze' : '❌ Nie tym razem'));
    if (p.wyjasnienie) w.append(el('p', '', p.wyjasnienie));
    if (p.zrodlo) w.append(el('div', 'zrodlo', 'Źródło: ' + p.zrodlo));
    k.append(w);

    const dalej = el('button', 'glowny', q.i + 1 < q.pytania.length ? 'Następne pytanie →' : 'Zobacz wynik');
    dalej.onclick = () => { q.i++; rysuj() };
    k.append(dalej);
    dalej.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  k.append(zatwierdz);
  m.append(k);
  window.scrollTo(0, 0);
}

function ekranWynik() {
  const q = widok.quiz;
  const m = $('#ekran'); m.innerHTML = '';
  const proc = q.pytania.length ? q.dobre / q.pytania.length : 0;
  const k = el('div', 'karta');
  k.append(el('h2', '', proc >= PROG ? '🎉 Zaliczone' : 'Jeszcze nie ten poziom'));
  k.append(el('div', 'postep-liczba', `${q.dobre}/${q.pytania.length}`));
  k.append(el('p', 'cichy', proc >= PROG
    ? 'Dobra robota. Wróć tu za jakiś czas — powtórka po kilku dniach utrwala najmocniej.'
    : 'To normalne. Wróć do materiału, przeczytaj bloki „Jak to działa” i spróbuj ponownie.'));
  const ccpZle = q.ble.filter((p) => p.ccp);
  if (ccpZle.length) {
    const u = el('p', 'plakietka ccp', `Uwaga: ${ccpZle.length} niezaliczonych pytań o bezpieczeństwo — te wymagają 100%.`);
    k.append(u);
  }
  m.append(k);
  if (q.ble.length) {
    const b = el('button', 'glowny', `Popraw ${q.ble.length} błędnych`);
    b.onclick = () => startQuiz(q.ble, widok.tytul);
    m.append(b);
  }
  const w = el('button', 'drugi', 'Wróć do listy tomów');
  w.onclick = () => { widok = { nazwa: 'tomy' }; rysuj() };
  m.append(w);
  window.scrollTo(0, 0);
}

/* ── powtórka: wszystkie błędne z historii ────────────────────────────── */
function ekranPowtorka() {
  ustawPasek('Powtórka', false);
  const m = $('#ekran'); m.innerHTML = '';
  const p = postep();
  const ble = DANE.tomy.flatMap((t) => t.pytania).filter((x) => p[x.id] === false);
  const nowe = DANE.tomy.flatMap((t) => t.pytania).filter((x) => p[x.id] === undefined);
  const k = el('div', 'karta');
  k.append(el('h2', '', 'Powtórka'));
  k.append(el('p', 'cichy', ble.length
    ? `Masz ${ble.length} pytań, w których się pomyliłeś. To najlepszy materiał do powtórki — pamięć utrwala się na błędach.`
    : 'Brak błędnych odpowiedzi do powtórzenia. Możesz przećwiczyć pytania, których jeszcze nie widziałeś.'));
  m.append(k);
  if (ble.length) { const b = el('button', 'glowny', `Powtórz ${ble.length} błędnych`); b.onclick = () => startQuiz(ble, 'Powtórka'); m.append(b) }
  if (nowe.length) { const b = el('button', 'drugi', `Losowe 10 z nieprzerobionych (${nowe.length})`); b.onclick = () => startQuiz(przetasuj(nowe).slice(0, 10), 'Nowe pytania'); m.append(b) }
}

/* ── postęp ───────────────────────────────────────────────────────────── */
function ekranPostep() {
  ustawPasek('Twój postęp', false);
  const m = $('#ekran'); m.innerHTML = '';
  const p = postep();
  const wszystkie = DANE.tomy.flatMap((t) => t.pytania);
  const zwykle = wszystkie.filter((x) => !x.ccp);
  const ccp = wszystkie.filter((x) => x.ccp);
  const ok = zwykle.filter((x) => p[x.id] === true).length;
  const ccpOk = ccp.filter((x) => p[x.id] === true).length;

  const k = el('div', 'karta');
  k.append(el('h2', '', 'Razem'));
  k.append(el('div', 'postep-liczba', `${Math.round((ok / (zwykle.length || 1)) * 100)}%`));
  k.append(el('p', 'cichy', `${ok} z ${zwykle.length} pytań zaliczonych`));
  const pasek = el('div', 'pasek'); const i = el('i'); i.style.width = Math.round((ok / (zwykle.length || 1)) * 100) + '%'; pasek.append(i); k.append(pasek);
  m.append(k);

  const kc = el('div', 'karta');
  kc.append(el('h3', '', 'Bezpieczeństwo żywności (CCP)'));
  kc.append(el('p', '', `${ccpOk} z ${ccp.length} zaliczonych`));
  kc.append(el('p', 'cichy mini', 'Pytania oznaczone jako krytyczne wymagają 100% — bez nich tom nie jest opanowany.'));
  m.append(kc);

  const lista = el('div', 'karta');
  lista.append(el('h3', '', 'Tomy'));
  for (const t of DANE.tomy) {
    const s = policzTom(t, p);
    const r = el('div', 'cichy mini');
    r.textContent = `${s.stan === 'ok' ? '✅' : s.stan === 'toku' ? '🔸' : '⬜'} ${t.nazwa} — ${s.ok}/${s.zwykle}`;
    lista.append(r);
  }
  m.append(lista);

  const reset = el('button', 'drugi', 'Wyczyść mój postęp');
  reset.onclick = () => { if (confirm('Skasować cały zapisany postęp na tym urządzeniu?')) { localStorage.removeItem(klucz(KLUCZ_POSTEP)); rysuj() } };
  m.append(reset);
  const info = el('p', 'cichy mini', 'Postęp zapisuje się wyłącznie w tej przeglądarce. Nikt go nie widzi i nie jest nigdzie wysyłany.');
  m.append(info);
}

/* ── szukajka ─────────────────────────────────────────────────────────── */
function ekranSzukaj() {
  ustawPasek('Szukaj', true);
  const m = $('#ekran'); m.innerHTML = '';
  const input = el('input', 'szukajka');
  input.type = 'search'; input.placeholder = 'np. zakwas, garowanie, alergen…';
  m.append(input);
  const wyniki = el('div'); m.append(wyniki);

  const szukaj = () => {
    const q = norm(input.value.trim());
    wyniki.innerHTML = '';
    if (q.length < 2) { wyniki.append(el('p', 'cichy', 'Wpisz co najmniej dwa znaki.')); return }
    let n = 0;
    for (const t of DANE.tomy) {
      const trafienia = [];
      /* Szukamy po tekście BEZ składni — gwiazdki i backticki nie mogą
         decydować o trafieniu („**hydracja**" ma się znaleźć na „hydracja").
         Wykład ciągły (`tresc`) jest tu obowiązkowy: od standardu
         podręcznikowego mieszka w nim większość treści modułu, więc szukajka
         omijająca go nie znajdowałaby prawie niczego. */
      const pasuje = (x) => norm(bezZnacznikow(x)).includes(q);
      if (pasuje(t.nazwa) || pasuje(t.intro)) trafienia.push(t.intro || t.nazwa);
      (t.cele || []).forEach((c) => { if (pasuje(c)) trafienia.push(c) });
      t.karty.forEach((k) => {
        if (pasuje(k.tytul)) trafienia.push(k.tytul);
        (k.tresc || []).forEach((a) => { if (pasuje(a)) trafienia.push(a.slice(0, 160) + '…') });
        (k.punkty || []).forEach((p) => { if (pasuje(p)) trafienia.push(p) });
        if (k.mechanizm && pasuje(k.mechanizm)) trafienia.push(k.mechanizm.slice(0, 160) + '…');
      });
      (t.parametry || []).forEach((x) => { if (pasuje(x.nazwa)) trafienia.push(`${x.nazwa} — ${x.wartosc}`) });
      (t.bledy || []).forEach((x) => { if (pasuje(x.objaw)) trafienia.push(`${x.objaw} → ${x.korekta}`) });
      (t.pojecia || []).forEach((p) => { if (pasuje(p.termin)) trafienia.push(`${p.termin} — ${p.znaczenie.slice(0, 140)}…`) });
      if (!trafienia.length) continue;
      n++;
      const k = el('div', 'karta');
      k.append(el('h3', '', t.nazwa));
      trafienia.slice(0, 3).forEach((x) => k.append(el('p', 'mini', x)));
      const b = el('button', 'drugi', 'Otwórz materiał →');
      b.onclick = () => { widok = { nazwa: 'tom', tom: t }; rysuj() };
      k.append(b);
      wyniki.append(k);
    }
    if (!n) wyniki.append(el('p', 'cichy', 'Nic nie znalazłem. Spróbuj innego słowa.'));
  };
  input.oninput = szukaj;
  input.focus();
}

/* ── router ───────────────────────────────────────────────────────────── */
function rysuj() {
  const w = widok.nazwa;
  if (w === 'tomy') ekranTomy();
  else if (w === 'tom') ekranTom();
  else if (w === 'quiz') ekranQuiz();
  else if (w === 'powtorka') ekranPowtorka();
  else if (w === 'postep') ekranPostep();
  else if (w === 'szukaj') ekranSzukaj();
  document.querySelectorAll('#nawigacja button').forEach((b) => b.classList.toggle('akt', b.dataset.widok === w));
}

function podepnij() {
  $('#wstecz').onclick = () => { widok = { nazwa: 'tomy' }; rysuj() };
  $('#szukajBtn').onclick = () => { widok = { nazwa: 'szukaj' }; rysuj() };
  document.querySelectorAll('#nawigacja button').forEach((b) => {
    b.onclick = () => { widok = { nazwa: b.dataset.widok }; rysuj() };
  });
}

async function start() {
  try {
    DANE = JSON.parse(document.getElementById('dane-kursu').textContent);
  } catch (e) {
    $('#ekran').innerHTML = '';
    const k = el('div', 'karta');
    k.append(el('h2', '', 'Nie udało się wczytać materiałów'));
    k.append(el('p', 'cichy', 'Sprawdź połączenie i odśwież stronę. Jeśli otwierasz plik lokalnie (file://), uruchom prosty serwer HTTP — przeglądarka blokuje wczytywanie danych z dysku.'));
    $('#ekran').append(k);
    return;
  }
  $('#nawigacja').hidden = false;
  podepnij();
  rysuj();
  }

if (typeof document !== 'undefined') start();

</script>
